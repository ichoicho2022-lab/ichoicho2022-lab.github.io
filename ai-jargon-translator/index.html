<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI黑话翻译器 - 让AI术语不再难懂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#7c3aed;--primary-light:#a78bfa;--primary-bg:#f5f3ff;--primary-700:#6d28d9;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-900:#111827;--green-bg:#ecfdf5;--green-text:#047857;--amber-bg:#fffbeb;--amber-text:#b45309;--red-bg:#fef2f2;--red-text:#b91c1c}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif;background:#fff;color:var(--gray-900);-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font:inherit;border:none;background:none}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray-100);height:56px;display:flex;align-items:center}
.nav-inner{max-width:960px;margin:0 auto;padding:0 16px;width:100%;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;color:var(--gray-900);cursor:pointer}
.nav-logo:hover{color:var(--primary)}

/* Search */
.hero{max-width:960px;margin:0 auto;padding:64px 16px 48px;text-align:center}
.hero h1{font-size:2.5rem;font-weight:700;margin-bottom:12px}
.hero h1 span{color:var(--primary)}
.hero p{font-size:1.1rem;color:var(--gray-500);margin-bottom:32px;max-width:480px;margin-left:auto;margin-right:auto}
.search-wrap{max-width:600px;margin:0 auto;position:relative}
.search-wrap input{width:100%;padding:14px 100px 14px 44px;font-size:15px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:12px;outline:none;transition:all .2s}
.search-wrap input:focus{background:#fff;box-shadow:0 0 0 3px rgba(124,58,237,.15);border-color:transparent}
.search-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400)}
.search-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:8px 16px;background:var(--primary);color:#fff;font-size:13px;font-weight:500;border-radius:8px;transition:background .2s}
.search-wrap button:hover{background:var(--primary-700)}

/* Section */
.section{max-width:960px;margin:0 auto;padding:0 16px 48px}
.section-title{font-size:1.1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* Hot terms */
.hot-wrap{display:flex;flex-wrap:wrap;gap:8px}
.hot-item{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--primary-bg);color:var(--primary-700);font-size:14px;font-weight:500;border-radius:8px;cursor:pointer;transition:background .2s}
.hot-item:hover{background:#ede9fe}

/* Category grid */
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:768px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:#fff;border:1px solid var(--gray-100);border-radius:12px;cursor:pointer;transition:all .2s;text-align:center}
.cat-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px)}
.cat-item .emoji{font-size:1.5rem}
.cat-item .name{font-size:13px;font-weight:500;color:var(--gray-700)}
.cat-item .name:hover{color:var(--primary)}
.cat-item .count{font-size:11px;color:var(--gray-400)}

/* Tag filter */
.tag-wrap{display:flex;flex-wrap:wrap;gap:8px}
.tag-item{display:inline-flex;align-items:center;padding:4px 10px;background:var(--primary-bg);color:var(--primary-700);font-size:12px;font-weight:500;border-radius:9999px;cursor:pointer;transition:all .2s;border:none}
.tag-item:hover{background:#ede9fe}
.tag-item.active{background:var(--primary);color:#fff}

/* Term cards grid */
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:768px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.cards-grid{grid-template-columns:1fr}}

/* Term card */
.card{padding:20px;background:#fff;border:1px solid var(--gray-100);border-radius:12px;cursor:pointer;transition:all .2s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-name{font-size:15px;font-weight:600;color:var(--gray-900);transition:color .2s}
.card:hover .card-name{color:var(--primary)}
.card-en{font-size:11px;color:var(--gray-400);margin-bottom:4px}
.card-desc{font-size:13px;color:var(--gray-600);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.card-tag{padding:2px 8px;background:var(--primary-bg);color:var(--primary-700);font-size:11px;font-weight:500;border-radius:9999px}

/* Difficulty badges */
.difficulty{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:500;flex-shrink:0}
.difficulty-新手{background:var(--green-bg);color:var(--green-text)}
.difficulty-进阶{background:var(--amber-bg);color:var(--amber-text)}
.difficulty-专业{background:var(--red-bg);color:var(--red-text)}

/* Detail page */
.detail{max-width:720px;margin:0 auto;padding:32px 16px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-400);margin-bottom:32px}
.breadcrumb a:hover{color:var(--primary)}
.detail-header{margin-bottom:32px}
.detail-header h1{font-size:2rem;font-weight:700;margin-bottom:8px}
.detail-en{font-size:1rem;color:var(--gray-400);margin-bottom:8px}
.detail-aliases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.detail-alias{padding:3px 10px;background:var(--gray-100);color:var(--gray-600);font-size:12px;border-radius:9999px}
.detail-sentence{font-size:1.15rem;color:var(--primary);font-weight:500;line-height:1.6}
.detail-section{margin-bottom:28px}
.detail-section h2{font-size:1rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.detail-box{padding:20px;border-radius:12px;line-height:1.7}
.detail-box.purple{background:rgba(124,58,237,.04);border:1px solid rgba(124,58,237,.1)}
.detail-box.amber{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.1)}
.detail-text{color:var(--gray-600);line-height:1.7}
.use-case{display:flex;align-items:flex-start;gap:10px;padding:10px;background:var(--gray-50);border-radius:8px}
.use-case .num{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:rgba(124,58,237,.1);color:var(--primary-700);border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}
.use-case .text{font-size:13px;color:var(--gray-700)}
.example-box{padding:14px;background:var(--gray-50);border:1px solid var(--gray-100);border-radius:10px;font-size:13px;color:var(--gray-600);line-height:1.6}
.related-wrap{display:flex;flex-wrap:wrap;gap:8px}
.related-item{display:inline-flex;align-items:center;padding:7px 14px;background:#fff;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;font-weight:500;color:var(--gray-700);cursor:pointer;transition:all .2s}
.related-item:hover{color:var(--primary);border-color:rgba(124,58,237,.2);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.back-btn{display:inline-block;margin-top:40px;font-size:13px;color:var(--primary);cursor:pointer}
.back-btn:hover{color:var(--primary-700)}

/* Filter bar */
.filter-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.filter-bar h2{font-size:1rem;font-weight:600}
.filter-bar .clear{font-size:13px;color:var(--primary);cursor:pointer}

/* Empty state */
.empty{text-align:center;padding:48px;color:var(--gray-400)}
.empty p:first-child{font-size:1rem;margin-bottom:6px}

/* Footer */
.footer{border-top:1px solid var(--gray-100);padding:32px 0;text-align:center;font-size:13px;color:var(--gray-400);margin-top:48px}

/* Fade in */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease-out}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:3px}
</style>
</head>

const terms=[
{id:'ai',name:'AI',aliases:['人工智能','Artificial Intelligence'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'新手',en:'Artificial Intelligence',one:'AI 就是让机器学会像人一样思考、理解和决策的技术。',plain:'想象你有一个超级助手，它能看懂文字、听懂话、识别图片，还能帮你写文章、做分析。AI 就是让电脑变成这样的超级助手。',tech:'AI 是计算机科学的一个分支，致力于创建能够执行通常需要人类智能的任务的系统，包括学习、推理、感知和自然语言理解。',why:'AI 正在改变几乎所有行业的运作方式，从自动化到决策支持，它让机器从"工具"变成"合作伙伴"。',biz:'客户提到"数字化转型"或"智能化"，背后往往就是 AI 在驱动。',useCases:['智能客服自动回答用户问题','AI 辅助医生读片诊断','自动化数据分析和报告生成'],related:['AGI','大模型','LLM','Multimodal'],examples:['一家保险公司用 AI 自动审核理赔材料，审核效率提升 80%。']},
{id:'agi',name:'AGI',aliases:['通用人工智能'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'进阶',en:'Artificial General Intelligence',one:'AGI 是能像人一样处理各种任务的 AI，不限于某个领域。',plain:'现在的 AI 大多是"偏科生"——下棋的不会写诗，画画的不会算数。AGI 是"全科生"，什么都能学、什么都能干。',tech:'AGI 指具备跨领域通用智能的 AI 系统，能理解、学习和应用知识到任意任务中。',why:'AGI 是 AI 领域的终极目标，实现后将彻底改变人类与机器的关系。',biz:'客户问"AI 能不能自己思考？"——这就是在问 AGI。目前还没实现。',useCases:['自主完成跨领域复杂任务','像人一样学习新技能','独立进行科学研究和创新'],related:['AI','LLM','大模型','Reasoning Model'],examples:['OpenAI 的最终目标就是实现 AGI。']},
{id:'llm',name:'LLM',aliases:['大语言模型','Large Language Model'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'新手',en:'Large Language Model',one:'LLM 是读过海量文本后，能理解和生成人类语言的大模型。',plain:'就像一个读了整个互联网的"超级学霸"，你问什么它都能聊两句。ChatGPT 背后就是一个 LLM。',tech:'LLM 是基于 Transformer 架构、在海量文本数据上训练的大型神经网络模型，通过预测下一个 Token 来生成文本。',why:'LLM 是当前 AI 应用的核心引擎，几乎所有 AI 产品都基于 LLM 构建。',biz:'客户说的"大模型""ChatGPT 类产品"，底层就是 LLM。',useCases:['智能对话和问答','文档摘要和翻译','代码生成和辅助编程'],related:['大模型','Transformer','Token','Context Window'],examples:['GPT-4、Claude、GLM 都是典型的 LLM。']},
{id:'foundation-model',name:'大模型',aliases:['基础模型','Foundation Model'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'新手',en:'Foundation Model',one:'大模型是经过海量数据训练的 AI 基础引擎，可以适配各种下游任务。',plain:'大模型就像一个"全能型人才"——先上了综合大学（预训练），然后可以快速学会任何专业（微调）。',tech:'大模型指参数量巨大的深度学习模型，通过大规模预训练获得通用能力，再通过微调或 Prompt 适配下游任务。',why:'大模型范式让 AI 开发从"造轮子"变成"调参数"，大幅降低了 AI 应用的门槛。',biz:'客户说想"用大模型"，其实就是在说想用 LLM 做业务。',useCases:['企业知识库问答','智能客服','文档自动处理'],related:['LLM','Transformer','Fine-tuning'],examples:['一家银行用大模型自动审核贷款材料，效率提升 60%。']},
{id:'token',name:'Token',aliases:['词元','标记'],category:'AI基础概念',tags:['基础概念'],difficulty:'新手',one:'Token 是 AI 处理文字的最小单位，大约相当于半个到一个小词。',plain:'AI 不是按"字"读文章的，而是把文章切成一个个 Token。Token 数量决定了 AI 能处理多少内容、花多少钱。',tech:'Token 是 LLM 处理文本的基本单元，通过分词器将原始文本映射为整数序列，直接影响计算成本和上下文容量。',why:'Token 是大模型计费和性能的关键指标。',biz:'客户问"用大模型贵不贵"，答案取决于 Token 用量。',useCases:['计算 API 调用成本','评估模型处理能力','优化输入减少 Token 消耗'],related:['LLM','Context Window','API'],examples:['GPT-4 输入约 $0.03/1K Token，输出约 $0.06/1K Token。']},
{id:'context-window',name:'Context Window',aliases:['上下文窗口','上下文长度'],category:'AI基础概念',tags:['基础概念'],difficulty:'新手',en:'Context Window',one:'Context Window 是 AI 一次能记住和处理的文本长度上限。',plain:'就像人的短期记忆容量有限，AI 也有"记忆窗口"——一次对话中它能回看的最大文本量。',tech:'Context Window 指模型在一次推理中能处理的最大 Token 数量，由模型架构的位置编码机制决定。',why:'Context Window 大小直接影响模型能否处理长文档和多轮对话。',biz:'客户想"把 100 页合同丢给 AI 分析"，需要选 Context Window 足够大的模型。',useCases:['长文档分析','多轮复杂对话','大批量代码审查'],related:['Token','LLM','RAG'],examples:['Claude 3.5 支持 200K Token，约 15 万字。']},
{id:'transformer',name:'Transformer',aliases:['注意力机制模型'],category:'AI基础概念',tags:['基础概念','技术架构'],difficulty:'进阶',one:'Transformer 是目前几乎所有大模型背后的核心架构，擅长理解文本之间的关系。',plain:'以前的 AI 读文章像逐字读，Transformer 像"扫描全文+画重点"——它能同时关注整段话，理解词与词之间的关系。',tech:'Transformer 是 2017 年提出的基于自注意力机制的神经网络架构，是 GPT、BERT 等模型的基础。',why:'Transformer 架构是大模型时代的基石。',biz:'要知道它是"大模型之所以强"的底层原因。',useCases:['自然语言理解和生成','机器翻译','文本摘要'],related:['LLM','大模型','Training'],examples:['GPT、BERT、GLM 都是 Transformer 架构。']},
{id:'hallucination',name:'Hallucination',aliases:['幻觉','AI幻觉'],category:'AI基础概念',tags:['基础概念','风险'],difficulty:'新手',one:'Hallucination 是 AI 编造不存在信息的现象，俗称"一本正经地胡说八道"。',plain:'AI 有时候会"自信地胡说"——给出听起来很靠谱但完全是编造的答案。需要用 RAG 等技术来约束。',tech:'Hallucination 指模型生成看似合理但实际上与事实不符的内容，是 LLM 的固有缺陷。',why:'幻觉是 LLM 在企业级应用中最大的风险。',biz:'客户担心"AI 会不会乱说"，需要解释 RAG 等方案如何降低幻觉风险。',useCases:['医疗诊断中的错误信息','法律咨询中的编造法条','金融报告中的虚假数据'],related:['RAG','LLM','Fine-tuning'],examples:['AI 自信地说"爱因斯坦 1958 年获得诺贝尔奖"（实际是 1921 年），这就是幻觉。']},
{id:'inference',name:'Inference',aliases:['推理','模型推理'],category:'AI基础概念',tags:['基础概念'],difficulty:'新手',en:'Inference',one:'Inference 是训练好的模型根据输入生成输出的过程，也就是"用模型"。',plain:'训练模型像"上学读书"，推理就是"毕业上班"。你给 AI 一个问题，它给出答案——这个过程就是推理。',tech:'Inference 是将训练好的模型用于新数据生成预测的过程，与 Training 相对。',why:'推理速度和成本直接决定用户体验和运营成本。',biz:'客户问"跑大模型要什么硬件"，问的就是推理阶段的资源需求。',useCases:['在线聊天机器人实时回复','批量文档处理','API 服务调用'],related:['Training','LLM','vLLM','API'],examples:['用户在 ChatGPT 输入问题，GPT-4 生成回答，这就是一次推理。']},
{id:'training',name:'Training',aliases:['训练','模型训练'],category:'AI基础概念',tags:['基础概念'],difficulty:'新手',one:'Training 是让 AI 从数据中学习知识的过程，就像教小孩读书。',plain:'AI 的"学习"就是看大量数据找规律。训练过程需要消耗大量算力和时间。',tech:'Training 是通过反向传播算法在大规模数据集上优化模型参数的过程。',why:'训练决定了模型的基础能力。',biz:'一般企业不需要自己训练模型，但需要理解训练和微调的区别。',useCases:['预训练基础大模型','微调行业专用模型','持续训练更新模型'],related:['Fine-tuning','Inference','大模型'],examples:['GPT-4 的训练使用了超过 1 万亿 Token 的数据和数万块 A100 GPU。']},
{id:'fine-tuning',name:'Fine-tuning',aliases:['微调','模型微调'],category:'AI基础概念',tags:['基础概念','模型优化'],difficulty:'进阶',en:'Fine-tuning',one:'Fine-tuning 是在已有大模型基础上，用专业数据让它更擅长某个领域。',plain:'大模型像"通才"，微调就是让它变成"专才"。比如给通用模型喂法律文书，它就成了法律专家。',tech:'Fine-tuning 是在预训练模型的基础上，使用领域特定的小规模数据进行继续训练。',why:'微调是企业将通用大模型变为行业专家的核心手段。',biz:'客户说"想让 AI 懂我们行业"，通常需要评估是微调还是 RAG。',useCases:['医疗领域专用模型','法律文书生成模型','金融风控模型'],related:['Training','LLM','大模型'],examples:['一家律所用 5 万份合同微调大模型，合同审查准确率从 70% 提升到 95%。']},

{id:'agent-memory',name:'Agent Memory',aliases:['Agent记忆','智能体记忆'],category:'Agent体系',tags:['Agent','核心概念'],difficulty:'进阶',en:'Agent Memory',one:'Agent Memory 是让 AI Agent 记住之前做过什么、学到了什么的能力。',plain:'没有记忆的 Agent 就像失忆症患者。Agent Memory 让它能记住用户偏好、历史对话，越用越聪明。',tech:'Agent Memory 分为短期记忆（上下文窗口内）和长期记忆（外部存储）。',why:'记忆是 Agent 做复杂任务和长期服务的基础。',biz:'客户想要"AI 越用越懂我"的体验，就需要给 Agent 加上记忆。',useCases:['长期客户服务中的上下文保持','个性化推荐','任务进度的跨会话追踪'],related:['Agent','RAG','Vector Database'],examples:['一个销售 Agent 记住了每个客户的沟通历史和偏好。']},
{id:'tool-use',name:'Tool Use',aliases:['工具使用','工具调用'],category:'Agent体系',tags:['Agent','核心概念'],difficulty:'进阶',en:'Tool Use',one:'Tool Use 是 AI Agent 调用外部工具（API、数据库等）完成任务的能力。',plain:'Agent 光会"说"不够，还得会"做"。Tool Use 让 AI 能调用搜索、发邮件、查数据库等。',tech:'Tool Use 指 LLM 根据意图选择并调用预定义工具，通过 Function Calling 或 MCP 实现。',why:'Tool Use 是 Agent 从"对话"升级为"执行"的关键能力。',biz:'客户说"想让 AI 对接我们的系统"，背后就是 Tool Use。',useCases:['查询企业数据库','发送通知邮件','调用第三方 API 获取实时数据'],related:['Agent','Function Calling','MCP','API'],examples:['一个财务 Agent 自动调用 ERP 系统 API 拉取报表数据。']},
{id:'reflection',name:'Reflection',aliases:['反思','自我反思'],category:'Agent体系',tags:['Agent','核心概念'],difficulty:'进阶',en:'Reflection',one:'Reflection 是 Agent 检查自己输出质量、发现错误并修正的能力。',plain:'人做完事会回头检查，Agent 也一样。Reflection 让 AI "三思而后行"。',tech:'Reflection 是 Agent 对自身输出进行评估和修正的机制。',why:'Reflection 是提高 Agent 可靠性的重要手段。',biz:'客户担心"AI 犯错怎么办"，Reflection 是一种自我纠错机制。',useCases:['代码生成后自动审查','方案输出的质量检查','数据分析结果的自检'],related:['Agent','Self-Correction','Agent Loop'],examples:['写作 Agent 生成报告后自动检查逻辑漏洞，发现问题就修正。']},
{id:'langgraph',name:'LangGraph',aliases:[],category:'Agent体系',tags:['Agent','开发框架'],difficulty:'进阶',one:'LangGraph 是 LangChain 推出的 Agent 编排框架，用图结构定义 Agent 流程。',plain:'LangGraph 让你像画流程图一样设计 Agent 的工作流，支持循环、分支和并行。',tech:'LangGraph 基于 LangChain 构建，使用有向图定义 Agent 工作流，支持状态管理和条件路由。',why:'复杂 Agent 流程需要清晰的编排和控制。',biz:'客户需要构建复杂的 AI 工作流时，LangGraph 是主流选择。',useCases:['多步骤审批流程自动化','带人工审核的 Agent 工作流','条件分支的业务流程'],related:['Agent','Workflow','Multi-Agent','CrewAI'],examples:['一个银行用 LangGraph 构建了贷款审批 Agent。']},
{id:'crewai',name:'CrewAI',aliases:[],category:'Agent体系',tags:['Agent','开发框架'],difficulty:'进阶',one:'CrewAI 是一个多 Agent 协作框架，让多个 AI 角色像团队一样工作。',plain:'CrewAI 让你定义一个"AI 团队"：研究员、写作员、审核员各司其职。',tech:'CrewAI 提供 Role-based Agent 定义、Task 分配和 Process 编排。',why:'CrewAI 降低了 Multi-Agent 系统的开发门槛。',biz:'客户需要"一组 AI 协作完成复杂任务"时，CrewAI 是最直观的方案。',useCases:['内容生产流水线','市场调研自动化','多角色协作的业务流程'],related:['Multi-Agent','Agent','LangGraph'],examples:['研究员 AI 调研竞品，写手 AI 写报告，审核 AI 检查质量。']},
{id:'rag',name:'RAG',aliases:['检索增强生成','Retrieval Augmented Generation'],category:'RAG与知识库',tags:['知识库','核心技术'],difficulty:'新手',en:'Retrieval-Augmented Generation',one:'RAG 是让 AI 先查资料再回答的技术，大幅减少"胡说八道"。',plain:'AI 回答之前，先从知识库里检索相关内容，然后基于真实内容回答。像开卷考试。',tech:'RAG 将信息检索与文本生成结合，先检索相关文档片段，再输入 LLM 生成回答。',why:'RAG 是企业级 AI 应用最成熟的技术方案。',biz:'客户说"想让 AI 回答基于我们自己的数据"——RAG 是标配方案。',useCases:['企业知识库问答','智能客服基于产品文档回答','法律/合规文档查询'],related:['Embedding','Vector Database','Chunking','Semantic Search'],examples:['一家保险公司用 RAG 让 AI 基于保险条款回答客户问题，准确率提升到 95%。']},
{id:'embedding',name:'Embedding',aliases:['向量化','词嵌入'],category:'RAG与知识库',tags:['知识库','核心技术'],difficulty:'进阶',en:'Embedding',one:'Embedding 是把文字变成数字向量的技术，让 AI 能计算"意思有多接近"。',plain:'AI 看不懂文字但看得懂数字。Embedding 把文字翻译成数字，意思相近的文字数字也相近。',tech:'Embedding 将文本映射到高维向量空间，语义相似的文本距离更近。',why:'Embedding 是 RAG、语义搜索和推荐系统的底层技术。',biz:'客户要做知识库问答，第一步就是把文档 Embedding 化存入向量库。',useCases:['语义搜索','文档相似度计算','RAG 的索引构建'],related:['RAG','Vector Database','Semantic Search'],examples:['搜"退货政策"能找到"退款流程"——因为 Embedding 知道它们语义相近。']},
{id:'vector-database',name:'Vector Database',aliases:['向量数据库','向量库'],category:'RAG与知识库',tags:['知识库','基础设施'],difficulty:'进阶',en:'Vector Database',one:'Vector Database 是专门存储和检索向量数据的数据库，是 RAG 的核心组件。',plain:'普通数据库存文字和数字，向量数据库存"意思"。能快速找到"意思最接近"的内容。',tech:'Vector Database 支持近似最近邻搜索（ANN），常用产品包括 Milvus、Pinecone、Qdrant 等。',why:'向量数据库是 RAG 架构的核心基础设施。',biz:'客户要做知识库方案时，向量数据库选型是关键决策。',useCases:['企业知识库存储和检索','推荐系统','图像相似度搜索'],related:['RAG','Embedding','Milvus','Pinecone'],examples:['一家企业用 Milvus 存储 10 万份文档向量，实现毫秒级语义搜索。']},
{id:'chunking',name:'Chunking',aliases:['分块','文本分块'],category:'RAG与知识库',tags:['知识库','数据处理'],difficulty:'进阶',en:'Chunking',one:'Chunking 是把长文档切成小段的技术，让 AI 能逐段检索和理解。',plain:'AI 不能一口吞下一整本书，Chunking 就是把书拆成一段一段的。',tech:'Chunking 是将长文档分割为小段的过程，常见策略包括固定长度分块和语义分块。',why:'分块策略是 RAG 效果的关键变量。',biz:'RAG 效果不好时，首先排查的就是 Chunking 策略。',useCases:['长文档入库前的预处理','法律条文的分段检索','知识库的精细化索引'],related:['RAG','Embedding','Vector Database'],examples:['一份 50 页合同，按段落分成 200 个 Chunk。']},
{id:'semantic-search',name:'Semantic Search',aliases:['语义搜索','语义检索'],category:'RAG与知识库',tags:['知识库','搜索技术'],difficulty:'进阶',en:'Semantic Search',one:'Semantic Search 是按"意思"搜索而不是按"关键词"搜索的技术。',plain:'传统搜索是精确匹配关键词，语义搜索是理解你"想找什么"。搜"便宜的手机"能找到"高性价比智能手机"。',tech:'Semantic Search 基于 Embedding 向量相似度进行检索。',why:'语义搜索让搜索更智能。',biz:'客户想要"比搜索框更聪明的搜索"，语义搜索就是核心能力。',useCases:['智能文档检索','知识库问答','商品推荐搜索'],related:['RAG','Embedding','Vector Database'],examples:['搜"如何办理退款"能找到"退货与退款流程"的文档。']},
{id:'re-ranking',name:'Re-ranking',aliases:['重排','结果重排'],category:'RAG与知识库',tags:['知识库','搜索优化'],difficulty:'专业',en:'Re-ranking',one:'Re-ranking 是对初步检索结果进行二次排序，提高最终结果的相关性。',plain:'先粗筛再精选。向量检索找出可能相关的 100 条，Re-ranking 再精选出最相关的 5 条。',tech:'Re-ranking 使用交叉编码器对检索结果进行精细化相关性打分和重排序。',why:'Re-ranking 是 RAG 效果优化的关键环节。',biz:'RAG 方案效果不理想时，加一层 Re-ranking 通常是最有效的优化。',useCases:['RAG 检索结果优化','搜索结果精排','推荐系统二次排序'],related:['RAG','Semantic Search'],examples:['向量检索 50 条，Re-ranking 精排取 Top 5，准确率从 70% 提升到 90%。']},
{id:'faiss',name:'FAISS',aliases:[],category:'RAG与知识库',tags:['知识库','开源工具'],difficulty:'专业',en:'Facebook AI Similarity Search',one:'FAISS 是 Meta 开源的高效向量检索库，适合本地快速部署。',plain:'FAISS 是免费的向量搜索工具，适合数据量不太大、想本地部署的场景。',tech:'FAISS 支持多种索引类型和 GPU 加速，适合百万到亿级向量检索。',why:'FAISS 是最流行的开源向量检索方案。',biz:'客户做 POC 或小规模 RAG 时，FAISS 是最简单的起步方案。',useCases:['本地 RAG 原型','中小规模向量检索','研发阶段的快速验证'],related:['Vector Database','Milvus','RAG'],examples:['一个团队用 FAISS+Python 搭建内部文档搜索，一周上线。']},
{id:'milvus',name:'Milvus',aliases:[],category:'RAG与知识库',tags:['知识库','开源工具'],difficulty:'专业',one:'Milvus 是开源的云原生向量数据库，适合大规模企业级 RAG 部署。',plain:'如果 FAISS 是"小作坊"，Milvus 就是"大工厂"。能处理亿级向量数据。',tech:'Milvus 支持亿级向量检索、多种索引类型和云原生架构。',why:'Milvus 是国内最流行的开源向量数据库。',biz:'客户需要大规模向量检索方案时，Milvus 是首选开源方案。',useCases:['亿级文档向量检索','分布式知识库','高并发搜索服务'],related:['Vector Database','FAISS','RAG'],examples:['一家银行用 Milvus 存储千万级合同向量。']},
{id:'prompt',name:'Prompt',aliases:['提示词','提示'],category:'Prompt工程',tags:['Prompt','基础概念'],difficulty:'新手',en:'Prompt',one:'Prompt 是你给 AI 的指令，决定 AI 怎么理解和回答你的问题。',plain:'Prompt 就是你跟 AI 说话的方式。同一个问题，不同的问法会得到完全不同的答案。',tech:'Prompt 是输入给 LLM 的文本指令，包括系统提示、用户输入和上下文信息。',why:'好的 Prompt 能让同样的模型输出质量提升数倍。',biz:'AI 效果不好，往往不是模型的问题，而是 Prompt 没写好。',useCases:['定义 AI 的角色和行为','引导 AI 按指定格式输出','约束 AI 的回答范围'],related:['System Prompt','Few-shot','Chain of Thought'],examples:['把"写个方案"改成"你是一位资深咨询顾问，请写一份面向金融行业的 AI 解决方案"——效果天差地别。']},
{id:'system-prompt',name:'System Prompt',aliases:['系统提示词','系统指令'],category:'Prompt工程',tags:['Prompt','基础概念'],difficulty:'新手',en:'System Prompt',one:'System Prompt 是给 AI 设定"人设和规则"的指令。',plain:'System Prompt 就像给新员工发的岗位说明书——你是什么角色、能做什么、不能做什么。',tech:'System Prompt 是 LLM 对话中的系统级指令，优先级最高，用于设定模型角色和行为约束。',why:'System Prompt 是控制 AI 行为的核心手段。',biz:'客户说"AI 回答太随意"，通常需要优化 System Prompt。',useCases:['设定 AI 的角色和语气','约束 AI 只回答特定领域','定义输出格式和长度'],related:['Prompt','User Prompt','Context Engineering'],examples:['"你是一位专业的法律顾问，只回答中国法律相关问题。"']},
{id:'few-shot',name:'Few-shot',aliases:['少样本学习','示例学习'],category:'Prompt工程',tags:['Prompt','技术方法'],difficulty:'进阶',en:'Few-shot Learning',one:'Few-shot 是在 Prompt 里给 AI 几个例子，让它照着做的技巧。',plain:'与其跟 AI 解释半天，不如直接给它看几个例子。就像教小朋友写字，先给范本。',tech:'Few-shot 是在 Prompt 中包含少量示例，通过 In-context Learning 引导模型按示例模式输出。',why:'Few-shot 是最实用的 Prompt 优化技巧之一。',biz:'客户要 AI 按特定格式输出，Few-shot 是最简单有效的方法。',useCases:['按模板生成文档','按特定风格写作','按格式输出结构化数据'],related:['Prompt','Zero-shot','Chain of Thought'],examples:['给 AI 看 3 个"客户回访摘要"示例，它就能按同样格式生成新的。']},
{id:'chain-of-thought',name:'Chain of Thought',aliases:['思维链','CoT'],category:'Prompt工程',tags:['Prompt','技术方法'],difficulty:'进阶',en:'Chain of Thought',one:'Chain of Thought 是让 AI 一步步推理而不是直接给答案的技术。',plain:'让 AI "把思考过程写出来"，就像让学生"写解题步骤"。一步步推理，答案更准。',tech:'Chain of Thought 是一种 Prompt 策略，通过要求模型展示中间推理步骤来提升准确性。',why:'CoT 是提升 LLM 推理能力最有效的方法之一。',biz:'客户要 AI 做复杂分析时，用 CoT 让 AI 展示推理过程，答案更可靠。',useCases:['复杂问题分解','数学和逻辑推理','多步骤决策分析'],related:['Prompt','Reasoning Model','ReAct'],examples:['问"这个客户该给几折？"，用 CoT 先分析客户等级→消费历史→推荐折扣。']},
{id:'react',name:'ReAct',aliases:['推理+行动'],category:'Prompt工程',tags:['Prompt','Agent'],difficulty:'进阶',en:'Reasoning + Acting',one:'ReAct 是让 AI 交替推理和行动的方法，想一步做一步。',plain:'ReAct 就是"边想边干"：先想该做什么→做一个动作→看结果→再想下一步。',tech:'ReAct 结合推理和行动，让 LLM 交替生成思考和行动。',why:'ReAct 是 Agent 的核心推理范式。',biz:'客户说"让 AI 边想边做"就是这个。',useCases:['Agent 自动化任务执行','多步骤信息检索','复杂问题分解与执行'],related:['Agent','Agent Loop','Chain of Thought'],examples:['研究 Agent：想"我需要查 X"→搜索 X→想"还需要 Y"→搜索 Y→综合回答。']},
{id:'structured-output',name:'Structured Output',aliases:['结构化输出','JSON输出'],category:'Prompt工程',tags:['Prompt','技术方法'],difficulty:'进阶',en:'Structured Output',one:'Structured Output 是让 AI 按指定格式（如 JSON）输出结果，方便程序直接使用。',plain:'AI 默认输出一大段文字，Structured Output 让它输出结构化数据，下游程序可以直接解析。',tech:'Structured Output 通过 JSON Schema、Function Calling 等技术让 LLM 输出符合预定义结构的数据。',why:'Structured Output 是 AI 与软件系统集成的关键桥梁。',biz:'客户要把 AI 输出接入业务系统，Structured Output 是必须的。',useCases:['AI 输出填充表单','AI 生成 API 请求参数','AI 输出存入数据库'],related:['JSON Schema','Function Calling','Prompt'],examples:['AI 分析客户需求后输出 JSON：{"intent":"退款","urgency":"高"}']},
{id:'context-engineering',name:'Context Engineering',aliases:['上下文工程'],category:'Prompt工程',tags:['Prompt','前沿概念'],difficulty:'专业',en:'Context Engineering',one:'Context Engineering 是精心设计 AI 输入上下文的技术，是 Prompt Engineering 的升级版。',plain:'Prompt Engineering 只关注"怎么写提示词"，Context Engineering 还关注"给 AI 喂什么信息"。',tech:'Context Engineering 是对 LLM 输入的全面管理，包括 System Prompt 设计、RAG 检索策略等。',why:'随着 AI 应用复杂度提升，需要系统性管理 AI 的整个上下文输入。',biz:'AI 效果不好，问题往往不在 Prompt，而在上下文——该给的信息没给到位。',useCases:['复杂 Agent 的输入设计','RAG 系统的上下文优化','多工具调用的信息整合'],related:['Prompt','System Prompt','RAG','Agent'],examples:['销售 Agent 的上下文：角色设定+客户资料+历史对话+产品信息+输出格式。']},
{id:'mcp',name:'MCP',aliases:['Model Context Protocol','模型上下文协议'],category:'MCP与工具调用',tags:['MCP','协议','工具调用'],difficulty:'进阶',en:'Model Context Protocol',one:'MCP 是 Anthropic 提出的开放协议，让 AI 能统一对接各种工具和数据源。',plain:'以前每个 AI 工具都要单独写接口对接，MCP 像一个"万能转接头"——只要工具支持 MCP，AI 就能直接用。',tech:'MCP 定义了 AI 模型与外部工具/数据源之间的通信规范，包括 MCP Server 和 MCP Client。',why:'MCP 统一了 AI 工具调用的接口标准。',biz:'客户问"AI 怎么对接我们的系统"，MCP 提供了标准化的对接方案。',useCases:['AI 对接企业内部系统','统一管理多个工具接口','AI 应用即插即用集成'],related:['MCP Server','MCP Client','Function Calling','API'],examples:['AI 助手通过 MCP 同时对接了 GitHub、Slack 和数据库。']},
{id:'mcp-server',name:'MCP Server',aliases:['MCP服务端'],category:'MCP与工具调用',tags:['MCP','开发工具'],difficulty:'专业',en:'MCP Server',one:'MCP Server 是按照 MCP 协议封装的工具服务端，对外暴露能力给 AI 调用。',plain:'MCP Server 就是"工具端"——把你的数据库、API 等封装成 MCP 格式，AI 就能直接调用。',tech:'MCP Server 按 MCP 协议实现工具注册、请求处理和响应返回。',why:'MCP Server 是 AI 工具生态的基础。',biz:'客户想让 AI 调用自己的系统，开发一个 MCP Server 是最标准化的方式。',useCases:['封装企业内部 API','数据库查询 MCP Server','文件系统访问 MCP Server'],related:['MCP','MCP Client','API'],examples:['把 CRM 系统封装成 MCP Server，AI 就能直接查询客户信息。']},

// ===== HELPERS =====
const getTermsByCat=c=>terms.filter(t=>t.category===c);
const getHot=()=>['llm','agent','mcp','rag','prompt','embedding','workflow','function-calling','cursor','coze'].map(id=>terms.find(t=>t.id===id)).filter(Boolean);
const getRecent=()=>[...terms].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,6);
const getAllTags=()=>{const s=new Set();terms.forEach(t=>t.tags.forEach(g=>s.add(g)));return[...s].sort()};
const search=q=>{const l=q.toLowerCase().trim();if(!l)return[];return terms.filter(t=>[t.name,t.en||'',...(t.aliases||[]),t.one,t.category,...t.tags,t.plain].join(' ').toLowerCase().includes(l)).sort((a,b)=>{if(a.name.toLowerCase()===l)return-1;if(b.name.toLowerCase()===l)return 1;return 0})};
const catSlug=c=>categories.find(x=>x.name===c)?.slug||'';

// ===== ROUTER =====
let currentView='home';
let currentId='';
let currentSlug='';
let searchQuery='';

function render(){
  const app=document.getElementById('app');
  if(currentView==='detail')app.innerHTML=renderDetail(currentId);
  else if(currentView==='category')app.innerHTML=renderCategory(currentSlug);
  else app.innerHTML=renderHome();
  window.scrollTo(0,0);
}

function navigate(view,id='',slug=''){
  currentView=view;currentId=id;currentSlug=slug;searchQuery='';render();
}

// ===== RENDER: HOME =====
function renderHome(){
  const hot=getHot();
  const recent=getRecent();
  const allTags=getAllTags();
  return `
  <div class="hero">
    <h1>AI黑话<span>翻译器</span></h1>
    <p>让AI术语不再难懂。面向学习者、产品经理、商务人员的AI知识库。</p>
    <div class="search-wrap">
      <svg class="icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="searchInput" type="text" placeholder="搜索AI术语、工具、厂商... 例如：LLM、Agent、RAG" value="${searchQuery}" onkeydown="if(event.key==='Enter')doSearch(this.value)">
      <button onclick="doSearch(document.getElementById('searchInput').value)">搜索</button>
    </div>
  </div>
  ${searchQuery?renderSearchResults(searchQuery):renderDefaultContent(hot,recent,allTags)}
  <div class="footer">AI黑话翻译器 · 让AI术语不再难懂 · 内置 ${terms.length}+ 词条</div>`;
}

function renderSearchResults(q){
  const results=search(q);
  return `<div class="section">
    <div class="filter-bar"><h2>搜索"${q}" <span style="font-weight:400;color:var(--gray-400);font-size:13px">${results.length} 个词条</span></h2><span class="clear" onclick="searchQuery='';render()">清除筛选</span></div>
    ${results.length?`<div class="cards-grid">${results.map(t=>renderCard(t)).join('')}</div>`:'<div class="empty"><p>没有找到相关词条</p><p style="font-size:13px">试试其他关键词或分类</p></div>'}
  </div>`;
}

function renderDefaultContent(hot,recent,allTags){
  return `
  <div class="section"><div class="section-title">🔥 热门术语</div><div class="hot-wrap">${hot.map(t=>`<span class="hot-item" onclick="navigate('detail','${t.id}')">🔥 ${t.name}</span>`).join('')}</div></div>
  <div class="section"><div class="section-title">📂 分类导航</div><div class="cat-grid">${categories.map(c=>{const n=getTermsByCat(c.name).length;return`<div class="cat-item" onclick="navigate('category','','${c.slug}')"><span class="emoji">${c.icon}</span><span class="name">${c.name}</span><span class="count">${n} 词条</span></div>`}).join('')}</div></div>
  <div class="section"><div class="section-title">🏷️ 标签筛选</div><div class="tag-wrap">${allTags.map(t=>`<span class="tag-item" onclick="doSearch('${t}')">${t}</span>`).join('')}</div></div>
  <div class="section"><div class="section-title">✨ 最新收录</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">${recent.map(t=>`<div class="card" onclick="navigate('detail','${t.id}')" style="display:flex;align-items:center;gap:12px;padding:12px"><span style="shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--primary-bg);color:var(--primary-700);border-radius:8px;font-size:12px;font-weight:700">N</span><div style="min-width:0"><div style="font-size:13px;font-weight:500;color:var(--gray-900)">${t.name}</div><div style="font-size:11px;color:var(--gray-400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.one}</div></div></div>`).join('')}</div></div>
  <div class="section"><div class="section-title">📋 全部词条 <span style="font-weight:400;color:var(--gray-400);font-size:13px">${terms.length} 个</span></div><div class="cards-grid">${terms.map(t=>renderCard(t)).join('')}</div></div>`;
}

function renderCard(t){
  return `<div class="card" onclick="navigate('detail','${t.id}')">
    <div class="card-header"><span class="card-name">${t.name}</span><span class="difficulty difficulty-${t.difficulty}">${t.difficulty}</span></div>
    ${t.en&&t.en!==t.name?`<div class="card-en">${t.en}</div>`:''}
    <div class="card-desc">${t.one}</div>
    <div class="card-tags">${t.tags.slice(0,3).map(g=>`<span class="card-tag">${g}</span>`).join('')}</div>
  </div>`;
}

// ===== RENDER: DETAIL =====
function renderDetail(id){
  const t=terms.find(x=>x.id===id);
  if(!t)return'<div class="detail"><p>未找到词条</p><span class="back-btn" onclick="navigate(\'home\')">← 返回首页</span></div>';
  const related=t.related.map(r=>terms.find(x=>x.id===r||x.name===r)).filter(Boolean);
  const slug=catSlug(t.category);
  return `<div class="detail fade-in">
    <nav class="breadcrumb"><a onclick="navigate('home')">首页</a><span>/</span><a onclick="navigate('category','','${slug}')">${t.category}</a><span>/</span><span style="color:var(--gray-600)">${t.name}</span></nav>
    <div class="detail-header">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:8px"><h1>${t.name}</h1><span class="difficulty difficulty-${t.difficulty}">${t.difficulty}</span></div>
      ${t.en&&t.en!==t.name?`<div class="detail-en">${t.en}</div>`:''}
      ${t.aliases&&t.aliases.length?`<div class="detail-aliases">${t.aliases.map(a=>`<span class="detail-alias">${a}</span>`).join('')}</div>`:''}
      <div class="detail-sentence">${t.one}</div>
    </div>
    <div class="detail-section"><h2>💬 人话解释</h2><div class="detail-box purple">${t.plain}</div></div>
    <div class="detail-section"><h2>🔬 技术解释</h2><p class="detail-text">${t.tech}</p></div>
    <div class="detail-section"><h2>❓ 为什么会出现</h2><p class="detail-text">${t.why}</p></div>
    ${t.biz?`<div class="detail-section"><h2>💼 商务人员怎么理解</h2><div class="detail-box amber">${t.biz}</div></div>`:''}
    <div class="detail-section"><h2>🎯 典型应用场景</h2><div style="display:grid;gap:8px">${t.useCases.map((u,i)=>`<div class="use-case"><span class="num">${i+1}</span><span class="text">${u}</span></div>`).join('')}</div></div>
    <div class="detail-section"><h2>📌 应用案例</h2><div style="display:grid;gap:8px">${t.examples.map(e=>`<div class="example-box">${e}</div>`).join('')}</div></div>
    ${related.length?`<div class="detail-section"><h2>🔗 相关术语</h2><div class="related-wrap">${related.map(r=>`<span class="related-item" onclick="navigate('detail','${r.id}')">${r.name}</span>`).join('')}</div></div>`:''}
    <div class="detail-section"><h2>🏷️ 标签</h2><div class="tag-wrap">${t.tags.map(g=>`<span class="tag-item" onclick="doSearch('${g}')">${g}</span>`).join('')}</div></div>
    <span class="back-btn" onclick="navigate('home')">← 返回首页</span>
  </div>`;
}

// ===== RENDER: CATEGORY =====
function renderCategory(slug){
  const cat=categories.find(c=>c.slug===slug);
  if(!cat)return'<div class="detail"><p>未找到分类</p><span class="back-btn" onclick="navigate(\'home\')">← 返回首页</span></div>';
  const catTerms=getTermsByCat(cat.name);
  return `<div style="max-width:960px;margin:0 auto;padding:32px 16px" class="fade-in">
    <nav class="breadcrumb"><a onclick="navigate('home')">首页</a><span>/</span><span style="color:var(--gray-600)">${cat.name}</span></nav>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><span style="font-size:2rem">${cat.icon}</span><h1 style="font-size:1.75rem;font-weight:700">${cat.name}</h1></div>
    <p style="color:var(--gray-500);margin-bottom:24px">${cat.desc} · ${catTerms.length} 个词条</p>
    ${catTerms.length?`<div class="cards-grid">${catTerms.map(t=>renderCard(t)).join('')}</div>`:'<div class="empty"><p>该分类暂无词条</p></div>'}
    <div style="margin-top:32px"><div class="section-title">其他分类</div><div style="display:flex;flex-wrap:wrap;gap:8px">${categories.filter(c=>c.slug!==slug).map(c=>`<span class="related-item" onclick="navigate('category','','${c.slug}')">${c.icon} ${c.name}</span>`).join('')}</div></div>
    <span class="back-btn" onclick="navigate('home')">← 返回首页</span>
  </div>`;
}

// ===== ACTIONS =====
function doSearch(q){searchQuery=q.trim();render();const input=document.getElementById('searchInput');if(input)input.value=searchQuery;}

// ===== INIT =====
render();
</script>
</body>
</html>
