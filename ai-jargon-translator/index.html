<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI黑话翻译器 - 让AI术语不再难懂</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#7c3aed;--primary-light:#a78bfa;--primary-bg:#f5f3ff;--primary-700:#6d28d9;--gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;--gray-400:#9ca3af;--gray-500:#6b7280;--gray-600:#4b5563;--gray-700:#374151;--gray-900:#111827;--green-bg:#ecfdf5;--green-text:#047857;--amber-bg:#fffbeb;--amber-text:#b45309;--red-bg:#fef2f2;--red-text:#b91c1c}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,'Noto Sans SC',sans-serif;background:#fff;color:var(--gray-900);-webkit-font-smoothing:antialiased;line-height:1.6}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font:inherit;border:none;background:none}

/* Nav */
.nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--gray-100);height:56px;display:flex;align-items:center}
.nav-inner{max-width:960px;margin:0 auto;padding:0 16px;width:100%;display:flex;align-items:center;justify-content:space-between}
.nav-logo{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:600;color:var(--gray-900);cursor:pointer}
.nav-logo:hover{color:var(--primary)}

/* Search */
.hero{max-width:960px;margin:0 auto;padding:64px 16px 48px;text-align:center}
.hero h1{font-size:2.5rem;font-weight:700;margin-bottom:12px}
.hero h1 span{color:var(--primary)}
.hero p{font-size:1.1rem;color:var(--gray-500);margin-bottom:32px;max-width:480px;margin-left:auto;margin-right:auto}
.search-wrap{max-width:600px;margin:0 auto;position:relative}
.search-wrap input{width:100%;padding:14px 100px 14px 44px;font-size:15px;background:var(--gray-50);border:1px solid var(--gray-200);border-radius:12px;outline:none;transition:all .2s}
.search-wrap input:focus{background:#fff;box-shadow:0 0 0 3px rgba(124,58,237,.15);border-color:transparent}
.search-wrap .icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--gray-400)}
.search-wrap button{position:absolute;right:8px;top:50%;transform:translateY(-50%);padding:8px 16px;background:var(--primary);color:#fff;font-size:13px;font-weight:500;border-radius:8px;transition:background .2s}
.search-wrap button:hover{background:var(--primary-700)}

/* Section */
.section{max-width:960px;margin:0 auto;padding:0 16px 48px}
.section-title{font-size:1.1rem;font-weight:600;margin-bottom:16px;display:flex;align-items:center;gap:8px}

/* Hot terms */
.hot-wrap{display:flex;flex-wrap:wrap;gap:8px}
.hot-item{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;background:var(--primary-bg);color:var(--primary-700);font-size:14px;font-weight:500;border-radius:8px;cursor:pointer;transition:background .2s}
.hot-item:hover{background:#ede9fe}

/* Category grid */
.cat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:768px){.cat-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.cat-grid{grid-template-columns:repeat(2,1fr)}}
.cat-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px;background:#fff;border:1px solid var(--gray-100);border-radius:12px;cursor:pointer;transition:all .2s;text-align:center}
.cat-item:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px)}
.cat-item .emoji{font-size:1.5rem}
.cat-item .name{font-size:13px;font-weight:500;color:var(--gray-700)}
.cat-item .name:hover{color:var(--primary)}
.cat-item .count{font-size:11px;color:var(--gray-400)}

/* Tag filter */
.tag-wrap{display:flex;flex-wrap:wrap;gap:8px}
.tag-item{display:inline-flex;align-items:center;padding:4px 10px;background:var(--primary-bg);color:var(--primary-700);font-size:12px;font-weight:500;border-radius:9999px;cursor:pointer;transition:all .2s;border:none}
.tag-item:hover{background:#ede9fe}
.tag-item.active{background:var(--primary);color:#fff}

/* Term cards grid */
.cards-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:768px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.cards-grid{grid-template-columns:1fr}}

/* Term card */
.card{padding:20px;background:#fff;border:1px solid var(--gray-100);border-radius:12px;cursor:pointer;transition:all .2s}
.card:hover{box-shadow:0 2px 8px rgba(0,0,0,.06);transform:translateY(-1px)}
.card-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-name{font-size:15px;font-weight:600;color:var(--gray-900);transition:color .2s}
.card:hover .card-name{color:var(--primary)}
.card-en{font-size:11px;color:var(--gray-400);margin-bottom:4px}
.card-desc{font-size:13px;color:var(--gray-600);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.card-tag{padding:2px 8px;background:var(--primary-bg);color:var(--primary-700);font-size:11px;font-weight:500;border-radius:9999px}

/* Difficulty badges */
.difficulty{display:inline-flex;align-items:center;padding:2px 8px;border-radius:9999px;font-size:11px;font-weight:500;flex-shrink:0}
.difficulty-新手{background:var(--green-bg);color:var(--green-text)}
.difficulty-进阶{background:var(--amber-bg);color:var(--amber-text)}
.difficulty-专业{background:var(--red-bg);color:var(--red-text)}

/* Detail page */
.detail{max-width:720px;margin:0 auto;padding:32px 16px}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--gray-400);margin-bottom:32px}
.breadcrumb a:hover{color:var(--primary)}
.detail-header{margin-bottom:32px}
.detail-header h1{font-size:2rem;font-weight:700;margin-bottom:8px}
.detail-en{font-size:1rem;color:var(--gray-400);margin-bottom:8px}
.detail-aliases{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.detail-alias{padding:3px 10px;background:var(--gray-100);color:var(--gray-600);font-size:12px;border-radius:9999px}
.detail-sentence{font-size:1.15rem;color:var(--primary);font-weight:500;line-height:1.6}
.detail-section{margin-bottom:28px}
.detail-section h2{font-size:1rem;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.detail-box{padding:20px;border-radius:12px;line-height:1.7}
.detail-box.purple{background:rgba(124,58,237,.04);border:1px solid rgba(124,58,237,.1)}
.detail-box.amber{background:rgba(245,158,11,.04);border:1px solid rgba(245,158,11,.1)}
.detail-text{color:var(--gray-600);line-height:1.7}
.use-case{display:flex;align-items:flex-start;gap:10px;padding:10px;background:var(--gray-50);border-radius:8px}
.use-case .num{width:22px;height:22px;display:flex;align-items:center;justify-content:center;background:rgba(124,58,237,.1);color:var(--primary-700);border-radius:50%;font-size:11px;font-weight:700;flex-shrink:0}
.use-case .text{font-size:13px;color:var(--gray-700)}
.example-box{padding:14px;background:var(--gray-50);border:1px solid var(--gray-100);border-radius:10px;font-size:13px;color:var(--gray-600);line-height:1.6}
.related-wrap{display:flex;flex-wrap:wrap;gap:8px}
.related-item{display:inline-flex;align-items:center;padding:7px 14px;background:#fff;border:1px solid var(--gray-200);border-radius:8px;font-size:13px;font-weight:500;color:var(--gray-700);cursor:pointer;transition:all .2s}
.related-item:hover{color:var(--primary);border-color:rgba(124,58,237,.2);box-shadow:0 1px 4px rgba(0,0,0,.04)}
.back-btn{display:inline-block;margin-top:40px;font-size:13px;color:var(--primary);cursor:pointer}
.back-btn:hover{color:var(--primary-700)}

/* Filter bar */
.filter-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.filter-bar h2{font-size:1rem;font-weight:600}
.filter-bar .clear{font-size:13px;color:var(--primary);cursor:pointer}

/* Empty state */
.empty{text-align:center;padding:48px;color:var(--gray-400)}
.empty p:first-child{font-size:1rem;margin-bottom:6px}

/* Footer */
.footer{border-top:1px solid var(--gray-100);padding:32px 0;text-align:center;font-size:13px;color:var(--gray-400);margin-top:48px}

/* Fade in */
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn .25s ease-out}

/* Scrollbar */
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:3px}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ===== DATA =====
const categories=[
{name:'AI基础概念',slug:'ai-basics',icon:'🧠',desc:'AI领域最核心的概念和术语'},
{name:'大模型厂商',slug:'llm-vendors',icon:'🏢',desc:'国内外大模型厂商和产品'},
{name:'Agent体系',slug:'agent',icon:'🤖',desc:'AI Agent相关的架构和框架'},
{name:'RAG与知识库',slug:'rag-knowledge',icon:'📚',desc:'检索增强生成与向量知识库'},
{name:'Prompt工程',slug:'prompt-engineering',icon:'✍️',desc:'提示词设计与优化技术'},
{name:'MCP与工具调用',slug:'mcp-tools',icon:'🔧',desc:'模型上下文协议与工具调用'},
{name:'AI开发工具',slug:'dev-tools',icon:'💻',desc:'AI编程和开发工具'},
{name:'AI工作流与应用平台',slug:'workflow-platform',icon:'🔄',desc:'AI工作流和应用构建平台'},
{name:'模型部署与API',slug:'deployment-api',icon:'☁️',desc:'模型部署方案和API服务'},
{name:'AI商业应用',slug:'business-apps',icon:'💼',desc:'AI在商业场景中的应用'}
];

const terms=[
{id:'ai',name:'AI',aliases:['人工智能','Artificial Intelligence'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'新手',en:'Artificial Intelligence',one:'AI 就是让机器学会像人一样思考、理解和决策的技术。',plain:'想象你有一个超级助手，它能看懂文字、听懂话、识别图片，还能帮你写文章、做分析。AI 就是让电脑变成这样的超级助手。',tech:'AI 是计算机科学的一个分支，致力于创建能够执行通常需要人类智能的任务的系统，包括学习、推理、感知和自然语言理解。',why:'AI 正在改变几乎所有行业的运作方式，从自动化到决策支持，它让机器从"工具"变成"合作伙伴"。',biz:'客户提到"数字化转型"或"智能化"，背后往往就是 AI 在驱动。理解 AI 的边界和能力，是做解决方案的起点。',useCases:['智能客服自动回答用户问题','AI 辅助医生读片诊断','自动化数据分析和报告生成'],related:['AGI','大模型','LLM','Multimodal'],examples:['一家保险公司用 AI 自动审核理赔材料，审核效率提升 80%。']},
{id:'agi',name:'AGI',aliases:['通用人工智能','Artificial General Intelligence'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'进阶',en:'Artificial General Intelligence',one:'AGI 是能像人一样处理各种任务的 AI，不限于某个领域。',plain:'现在的 AI 大多是"偏科生"——下棋的不会写诗，画画的不会算数。AGI 是"全科生"，什么都能学、什么都能干，跟人类一样灵活。',tech:'AGI 指具备跨领域通用智能的 AI 系统，能理解、学习和应用知识到任意任务中，与狭义 AI（Narrow AI）相对。',why:'AGI 是 AI 领域的终极目标，实现后将彻底改变人类与机器的关系。',biz:'客户问"AI 能不能自己思考？"——这就是在问 AGI。目前还没实现，但 Agent 方向是通向 AGI 的路径。',useCases:['自主完成跨领域复杂任务','像人一样学习新技能','独立进行科学研究和创新'],related:['AI','LLM','大模型','Reasoning Model'],examples:['OpenAI 的最终目标就是实现 AGI，目前 GPT 系列是其阶段性成果。']},
{id:'llm',name:'LLM',aliases:['大语言模型','Large Language Model'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'新手',en:'Large Language Model',one:'LLM 是读过海量文本后，能理解和生成人类语言的大模型。',plain:'就像一个读了整个互联网的"超级学霸"，你问什么它都能聊两句，还能帮你写文章、翻译、总结。ChatGPT 背后就是一个 LLM。',tech:'LLM 是基于 Transformer 架构、在海量文本数据上训练的大型神经网络模型，通过预测下一个 Token 来生成文本，具备自然语言理解与生成能力。',why:'LLM 是当前 AI 应用的核心引擎，几乎所有 AI 产品都基于 LLM 构建。',biz:'客户说的"大模型""ChatGPT 类产品"，底层就是 LLM。理解 LLM 的能力边界，才能给客户做合理的方案。',useCases:['智能对话和问答','文档摘要和翻译','代码生成和辅助编程'],related:['大模型','Transformer','Token','Context Window','Fine-tuning'],examples:['GPT-4、Claude、GLM 都是典型的 LLM。']},
{id:'foundation-model',name:'大模型',aliases:['基础模型','Foundation Model'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'新手',en:'Foundation Model',one:'大模型是经过海量数据训练的 AI 基础引擎，可以适配各种下游任务。',plain:'大模型就像一个"全能型人才"——先上了综合大学（预训练），然后可以快速学会任何专业（微调）。不像以前每个任务要从头训练。',tech:'大模型指参数量巨大（通常数十亿到数万亿）的深度学习模型，通过大规模预训练获得通用能力，再通过微调或 Prompt 适配下游任务。',why:'大模型范式让 AI 开发从"造轮子"变成"调参数"，大幅降低了 AI 应用的门槛。',biz:'客户说想"用大模型"，其实就是在说想用 LLM 做业务。需要帮他选对模型和部署方式。',useCases:['企业知识库问答','智能客服','文档自动处理'],related:['LLM','Transformer','Fine-tuning','Training'],examples:['一家银行用大模型自动审核贷款材料，效率提升 60%。']},
{id:'token',name:'Token',aliases:['词元','标记'],category:'AI基础概念',tags:['基础概念'],difficulty:'新手',en:'',one:'Token 是 AI 处理文字的最小单位，大约相当于半个到一个小词。',plain:'AI 不是按"字"读文章的，而是把文章切成一个个 Token。一个汉字大约是 1-2 个 Token，一个英文单词大约是 1-3 个 Token。Token 数量决定了 AI 能处理多少内容、花多少钱。',tech:'Token 是 LLM 处理文本的基本单元，通过分词器（Tokenizer）将原始文本映射为整数序列。Token 数量直接影响模型推理的计算成本和上下文容量。',why:'Token 是大模型计费和性能的关键指标，理解 Token 才能合理控制成本和选择模型。',biz:'客户问"用大模型贵不贵"，答案取决于 Token 用量。做方案时需要估算 Token 消耗来算成本。',useCases:['计算 API 调用成本','评估模型处理能力','优化输入减少 Token 消耗'],related:['LLM','Context Window','API'],examples:['GPT-4 的输入价格约 $0.03/1K Token，输出约 $0.06/1K Token。']},
{id:'context-window',name:'Context Window',aliases:['上下文窗口','上下文长度'],category:'AI基础概念',tags:['基础概念'],difficulty:'新手',en:'Context Window',one:'Context Window 是 AI 一次能记住和处理的文本长度上限。',plain:'就像人的短期记忆容量有限，AI 也有"记忆窗口"——一次对话中它能回看的最大文本量。窗口越大，AI 能处理的长文档就越多。',tech:'Context Window 指模型在一次推理中能处理的最大 Token 数量，由模型架构的位置编码机制决定。超出窗口的内容会被截断或遗忘。',why:'Context Window 大小直接影响模型能否处理长文档、多轮对话和复杂任务。',biz:'客户想"把 100 页合同丢给 AI 分析"，需要选 Context Window 足够大的模型，否则会被截断。',useCases:['长文档分析','多轮复杂对话','大批量代码审查'],related:['Token','LLM','RAG'],examples:['Claude 3.5 支持 200K Token 上下文，约 15 万字；GPT-4 Turbo 支持 128K。']},
{id:'transformer',name:'Transformer',aliases:['注意力机制模型'],category:'AI基础概念',tags:['基础概念','技术架构'],difficulty:'进阶',en:'',one:'Transformer 是目前几乎所有大模型背后的核心架构，擅长理解文本之间的关系。',plain:'以前的 AI 读文章像逐字读，Transformer 像"扫描全文+画重点"——它能同时关注整段话，理解词与词之间的关系。这就是为什么现在的 AI 这么聪明。',tech:'Transformer 是 2017 年提出的基于自注意力机制（Self-Attention）的神经网络架构，能并行处理序列数据，捕捉长距离依赖关系，是 GPT、BERT 等模型的基础。',why:'Transformer 架构是大模型时代的基石，几乎所有主流 LLM 都基于它。',biz:'不需要深究 Transformer 的技术细节，但要知道它是"大模型之所以强"的底层原因。',useCases:['自然语言理解和生成','机器翻译','文本摘要'],related:['LLM','大模型','Training'],examples:['GPT、BERT、GLM 都是 Transformer 架构的模型。']},
{id:'hallucination',name:'Hallucination',aliases:['幻觉','AI幻觉'],category:'AI基础概念',tags:['基础概念','风险'],difficulty:'新手',en:'',one:'Hallucination 是 AI 编造不存在信息的现象，俗称"一本正经地胡说八道"。',plain:'AI 有时候会"自信地胡说"——给出听起来很靠谱但完全是编造的答案。这在医疗、法律等严肃场景很危险，所以需要用 RAG 等技术来约束。',tech:'Hallucination 指模型生成看似合理但实际上与事实不符或与输入不一致的内容，是 LLM 的固有缺陷，源于统计生成的本质和训练数据的偏差。',why:'幻觉是 LLM 在企业级应用中最大的风险，必须通过技术手段缓解。',biz:'客户担心"AI 会不会乱说"，这就需要解释 RAG、知识库等方案如何降低幻觉风险。',useCases:['医疗诊断中的错误信息','法律咨询中的编造法条','金融报告中的虚假数据'],related:['RAG','LLM','Fine-tuning'],examples:['AI 自信地说"爱因斯坦 1958 年获得诺贝尔奖"（实际是 1921 年），这就是幻觉。']},
{id:'inference',name:'Inference',aliases:['推理','模型推理'],category:'AI基础概念',tags:['基础概念'],difficulty:'新手',en:'Inference',one:'Inference 是训练好的模型根据输入生成输出的过程，也就是"用模型"。',plain:'训练模型像"上学读书"，推理就是"毕业上班"。你给 AI 一个问题，它给出答案——这个过程就是推理。',tech:'Inference 是将训练好的模型用于新数据生成预测的过程，与 Training 相对。推理阶段不更新模型参数，计算成本主要在 GPU 内存和算力。',why:'推理是 AI 服务的核心环节，推理速度和成本直接决定用户体验和运营成本。',biz:'客户问"跑大模型要什么硬件"，问的就是推理阶段的资源需求。',useCases:['在线聊天机器人实时回复','批量文档处理','API 服务调用'],related:['Training','LLM','vLLM','API'],examples:['用户在 ChatGPT 输入问题，GPT-4 生成回答，这就是一次推理。']},
{id:'training',name:'Training',aliases:['训练','模型训练'],category:'AI基础概念',tags:['基础概念'],difficulty:'新手',en:'',one:'Training 是让 AI 从数据中学习知识的过程，就像教小孩读书。',plain:'AI 的"学习"就是看大量数据找规律。训练过程需要消耗大量算力和时间，像培养一个人才要花十几年一样，训练一个大模型也要花上百万美元。',tech:'Training 是通过反向传播算法在大规模数据集上优化模型参数的过程，通常分为预训练（Pre-training）和微调（Fine-tuning）两个阶段。',why:'训练决定了模型的基础能力，训练数据质量和规模是模型性能的关键。',biz:'一般企业不需要自己训练模型，但需要理解训练和微调的区别来做方案选型。',useCases:['预训练基础大模型','微调行业专用模型','持续训练更新模型'],related:['Fine-tuning','Inference','大模型'],examples:['GPT-4 的训练使用了超过 1 万亿 Token 的数据和数万块 A100 GPU。']},
{id:'fine-tuning',name:'Fine-tuning',aliases:['微调','模型微调'],category:'AI基础概念',tags:['基础概念','模型优化'],difficulty:'进阶',en:'Fine-tuning',one:'Fine-tuning 是在已有大模型基础上，用专业数据让它更擅长某个领域。',plain:'大模型像"通才"，微调就是让它变成"专才"。比如给通用模型喂法律文书，它就成了法律专家。',tech:'Fine-tuning 是在预训练模型的基础上，使用领域特定的小规模数据进行继续训练，使模型在特定任务或领域上表现更好，包括全量微调和参数高效微调（如 LoRA）。',why:'微调是企业将通用大模型变为行业专家的核心手段。',biz:'客户说"想让 AI 懂我们行业"，通常需要评估是微调还是 RAG，微调成本更高但效果更稳定。',useCases:['医疗领域专用模型','法律文书生成模型','金融风控模型'],related:['Training','LLM','大模型'],examples:['一家律所用 5 万份合同微调大模型，合同审查准确率从 70% 提升到 95%。']},
{id:'reasoning-model',name:'Reasoning Model',aliases:['推理模型','思考模型'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'进阶',en:'Reasoning Model',one:'Reasoning Model 是专门强化了逻辑推理能力的大模型，会"想清楚了再回答"。',plain:'普通 AI 像是"脱口而出"，推理模型像"先打草稿再回答"。它会在内部反复推演，确保答案更靠谱。OpenAI o1、DeepSeek-R1 就是推理模型。',tech:'Reasoning Model 通过 Chain-of-Thought、强化学习等技术增强了逻辑推理和数学证明能力，通常在回答前会进行多步内部推理（"思维链"），用更多计算换取更高质量的输出。',why:'推理模型让 AI 在数学、编程、逻辑分析等需要深度思考的任务上表现大幅提升。',biz:'客户需要 AI 做复杂分析、方案生成、代码审查时，推理模型比普通模型更可靠。',useCases:['复杂数学问题求解','多步骤逻辑推理','代码审查和 Bug 分析'],related:['LLM','Chain of Thought','大模型'],examples:['OpenAI o1 在数学竞赛题上的表现远超 GPT-4o，因为它会先"思考"再回答。']},
{id:'multimodal',name:'Multimodal',aliases:['多模态','多模态大模型'],category:'AI基础概念',tags:['基础概念','大模型'],difficulty:'新手',en:'Multimodal',one:'Multimodal 是 AI 同时理解和处理文字、图片、语音等多种类型信息的能力。',plain:'以前的 AI 只会读文字，多模态 AI 能看图、听声音、看视频——就像人一样，眼睛、耳朵、嘴巴都能用。',tech:'Multimodal 指模型能同时处理和生成多种模态的数据（文本、图像、音频、视频等），通过统一的表示学习实现跨模态理解和对齐。',why:'多模态是 AI 走向通用智能的关键一步，也是很多商业应用的基础。',biz:'客户说"想让 AI 看图说话"或"让 AI 理解视频内容"，就需要多模态模型。',useCases:['图文混合内容理解','视频内容分析','语音+文字交互'],related:['LLM','AI','大模型'],examples:['GPT-4o 可以同时理解图片和文字，你给它一张菜单图片，它能帮你翻译和推荐。']},
{id:'openai',name:'OpenAI',aliases:[],category:'大模型厂商',tags:['厂商','国外','大模型'],difficulty:'新手',en:'',one:'OpenAI 是 ChatGPT 的创造者，全球最有影响力的 AI 公司。',plain:'OpenAI 就是做出了 ChatGPT 的公司，它的 GPT 系列模型是行业标杆。几乎所有的 AI 产品都在对标 OpenAI。',tech:'OpenAI 是美国 AI 研究公司，发布了 GPT-4、GPT-4o、o1 等领先模型，以及 DALL-E、Whisper 等多模态模型，提供 OpenAI API 服务。',why:'OpenAI 定义了大模型行业的能力标准和产品形态，其发布的产品和 API 是行业风向标。',biz:'做 AI 方案时，OpenAI 通常是首选参考，但国内客户更关注合规和本土化替代。',useCases:['ChatGPT 对话和写作','GPT-4 API 接入企业系统','DALL-E 图像生成'],related:['LLM','API','大模型','Anthropic'],examples:['一家跨境电商用 GPT-4 API 自动生成多语言产品描述。']},
{id:'anthropic',name:'Anthropic',aliases:[],category:'大模型厂商',tags:['厂商','国外','大模型'],difficulty:'新手',en:'',one:'Anthropic 是 Claude 的创造者，主打安全可控的大模型。',plain:'Anthropic 是 OpenAI 前员工创办的公司，它的 Claude 系列模型以"安全""长上下文"著称，200K 上下文窗口是行业领先。',tech:'Anthropic 发布了 Claude 系列模型（Claude 3.5 Sonnet、Opus 等），以 Constitutional AI 方法论著称，在安全对齐和长上下文处理方面有优势。',why:'Claude 在编程、长文档分析等场景表现突出，是企业级应用的重要选择。',biz:'客户需要长文档处理或注重 AI 安全时，Claude 是很好的备选方案。',useCases:['长文档分析','代码生成','安全敏感场景的 AI 应用'],related:['OpenAI','LLM','API','MCP'],examples:['一家律所用 Claude 3.5 分析 200 页法律合同，准确率达 92%。']},
{id:'google-deepmind',name:'Google DeepMind',aliases:['DeepMind','谷歌DeepMind'],category:'大模型厂商',tags:['厂商','国外','大模型'],difficulty:'新手',en:'',one:'Google DeepMind 是谷歌的 AI 研究部门，推出了 Gemini 系列模型。',plain:'DeepMind 就是做 AlphaGo 的那个团队，后来和谷歌 AI 合并，推出了 Gemini 模型。在多模态和科学研究方面很强。',tech:'Google DeepMind 发布了 Gemini 系列模型，具备原生多模态能力，并通过 Vertex AI 提供企业级 API 服务。',why:'Gemini 在多模态和长上下文方面有独特优势，是 OpenAI 的重要竞争对手。',biz:'已在用谷歌云的客户，Gemini 是自然的选择；多模态场景也是 Gemini 的优势领域。',useCases:['多模态内容理解','科学研究辅助','谷歌生态集成'],related:['OpenAI','Vertex AI','LLM'],examples:['谷歌用 Gemini 驱动搜索、办公套件等全线产品的 AI 功能。']},
{id:'deepseek',name:'DeepSeek',aliases:['深度求索','DS'],category:'大模型厂商',tags:['厂商','国内','大模型'],difficulty:'新手',en:'',one:'DeepSeek 是国产开源大模型的代表，以高性价比和推理能力著称。',plain:'DeepSeek 是国产大模型的一匹黑马，开源免费，性能接近 GPT-4，成本却低很多。DeepSeek-R1 的推理能力特别强。',tech:'DeepSeek 由深度求索公司开发，发布了 DeepSeek-V3、DeepSeek-R1 等模型，采用 MoE 架构，推理模型在数学和代码任务上表现优异，且完全开源。',why:'DeepSeek 证明了低成本也能做出高性能模型，对国内 AI 生态有重大推动。',biz:'预算有限的客户，DeepSeek 是性价比最高的选择；开源也方便私有化部署。',useCases:['私有化部署企业 AI','推理密集型任务','开源模型二次开发'],related:['LLM','大模型','Reasoning Model','Ollama'],examples:['一家创业公司用 DeepSeek-V3 替代 GPT-4，成本降低 90%，效果基本持平。']},
{id:'zhipu-ai',name:'智谱AI',aliases:['智谱','Zhipu'],category:'大模型厂商',tags:['厂商','国内','大模型'],difficulty:'新手',en:'',one:'智谱AI 是清华系国产大模型公司，GLM 系列模型在中文场景表现出色。',plain:'智谱AI 是国内最早做大模型的公司之一，技术来自清华。GLM 系列在中文理解和生成方面很能打，而且开源生态做得好。',tech:'智谱AI 发布了 GLM-4、GLM-4V 等模型，基于自研的 GLM 架构，支持多模态，通过智谱 API 和开源模型提供服务。',why:'智谱是国内大模型第一梯队厂商，中文场景和开源生态方面有独特优势。',biz:'国内客户需要中文能力强、可私有化部署的方案时，智谱 GLM 是重要选项。',useCases:['中文内容生成','企业知识库','多模态应用'],related:['GLM','LLM','大模型'],examples:['一家媒体公司用 GLM-4 自动生成新闻摘要，中文质量优于 GPT-4。']},
{id:'glm',name:'GLM',aliases:['ChatGLM'],category:'大模型厂商',tags:['厂商','国内','大模型'],difficulty:'新手',en:'General Language Model',one:'GLM 是智谱AI 的大语言模型系列，中文能力突出。',plain:'GLM 是智谱AI 开发的国产大模型，从 ChatGLM-6B 到 GLM-4，一路迭代。开源版本可以免费下载使用，在国内开发者中很受欢迎。',tech:'GLM 是基于自回归填空的预训练架构，兼顾理解和生成能力。GLM-4 系列支持 128K 上下文、多模态和工具调用。',why:'GLM 是国产开源大模型的代表，为国内开发者提供了可私有化部署的选择。',biz:'客户需要"国产替代"或"数据不出境"时，GLM 是首选方案之一。',useCases:['私有化部署','中文对话系统','企业 AI 助手'],related:['智谱AI','LLM','Fine-tuning'],examples:['一家国企用 GLM-4 私有化部署内部知识库问答系统。']},
{id:'bytedance-ai',name:'字节跳动',aliases:['ByteDance AI'],category:'大模型厂商',tags:['厂商','国内','大模型'],difficulty:'新手',en:'',one:'字节跳动是豆包和 Coze 的母公司，在 AI 模型和平台方面全面布局。',plain:'字节跳动不只是做抖音的，它还在做大模型（豆包/Seed）、AI 平台（Coze）、AI 编程工具（Trae），是国内 AI 生态最完整的公司之一。',tech:'字节跳动通过火山引擎提供大模型 API 服务，发布了豆包和 Seed 系列模型，同时运营 Coze（AI 应用平台）和 Trae（AI IDE）。',why:'字节系 AI 产品覆盖了模型、平台、工具全链路，是国内 AI 生态的重要力量。',biz:'客户如果已经在用字节系产品（飞书、抖音），接入豆包/Coze 是最自然的选择。',useCases:['企业 AI 应用搭建','大模型 API 调用','AI 编程辅助'],related:['豆包','Coze','Trae','火山引擎'],examples:['一家公司用 Coze + 豆包搭建了内部智能客服，零代码完成。']},
{id:'volcengine',name:'火山引擎',aliases:['Volcengine'],category:'大模型厂商',tags:['厂商','国内','大模型','云服务'],difficulty:'进阶',en:'',one:'火山引擎是字节跳动的云服务平台，提供豆包大模型的 API 接口。',plain:'火山引擎就像字节的"阿里云"，是字节跳动面向企业的技术输出平台。想用豆包模型，就走火山引擎的 API。',tech:'火山引擎是字节跳动旗下的企业级技术服务平台，提供包括大模型 API、向量数据库、机器学习平台等在内的 AI 基础设施。',why:'火山引擎是国内企业使用豆包大模型的官方通道，也是字节 AI 能力的商业出口。',biz:'客户想用豆包模型做方案，就需要对接火山引擎的服务和计费体系。',useCases:['豆包大模型 API 调用','企业 AI 平台搭建','向量数据库服务'],related:['豆包','字节跳动','API'],examples:['一家互联网公司通过火山引擎接入豆包模型，搭建内容审核系统。']},
{id:'doubao',name:'豆包',aliases:['Doubao'],category:'大模型厂商',tags:['厂商','国内','大模型'],difficulty:'新手',en:'',one:'豆包是字节跳动推出的国产大模型，主打高性价比和中文能力。',plain:'豆包是字节跳动的大模型品牌，有手机 App 也有 API。模型便宜好用，中文能力很强，是很多企业首选的国产模型。',tech:'豆包系列模型包括 Pro、Lite 等版本，通过火山引擎提供 API 服务，支持长上下文、多模态和 Function Calling。',why:'豆包以极致性价比打开了国产大模型市场，是很多企业 AI 应用的入门选择。',biz:'预算敏感的客户，豆包是性价比最高的国产大模型选择之一。',useCases:['企业智能客服','内容生成','知识库问答'],related:['字节跳动','火山引擎','Coze','LLM'],examples:['一家教育公司用豆包模型做 AI 答疑，成本仅为 GPT-4 的十分之一。']},
{id:'tencent-hunyuan',name:'腾讯混元',aliases:['混元','Hunyuan'],category:'大模型厂商',tags:['厂商','国内','大模型'],difficulty:'新手',en:'',one:'腾讯混元是腾讯自研的大模型，深度集成微信和企业微信生态。',plain:'腾讯混元是腾讯的大模型，最大的优势是和微信、企业微信、腾讯云深度打通，适合在腾讯生态里做 AI 应用。',tech:'腾讯混元系列模型支持文本、图像、视频等多模态，通过腾讯云提供 API 服务，与企业微信、腾讯会议等产品深度集成。',why:'对于在微信生态做 AI 应用的场景，腾讯混元有天然优势。',biz:'客户如果在企业微信上做 AI 客服或智能助手，腾讯混元是最佳选择。',useCases:['企业微信智能客服','微信生态 AI 应用','腾讯云 AI 服务'],related:['腾讯','LLM','API'],examples:['一家零售企业用腾讯混元+企业微信搭建 AI 客服，日处理 10 万+咨询。']},
{id:'tongyi-qianwen',name:'通义千问',aliases:['千问','Qwen'],category:'大模型厂商',tags:['厂商','国内','大模型'],difficulty:'新手',en:'Tongyi Qianwen / Qwen',one:'通义千问是阿里云的大模型，开源生态活跃，Qwen 系列在国际排名靠前。',plain:'通义千问是阿里云的大模型品牌，Qwen 开源版本在全球开源模型中排名很高。想自己部署模型又想要好的效果，Qwen 是热门选择。',tech:'通义千问包括 Qwen2.5 等开源模型和闭源 API，支持 128K 上下文和多模态，在多项国际基准测试中排名前列。',why:'Qwen 开源生态为国内开发者提供了高质量的自部署选择，在学术界和产业界都有广泛影响。',biz:'客户需要开源模型做私有化部署时，Qwen 系列是最优选择之一。',useCases:['私有化部署','开源模型二次开发','阿里云生态集成'],related:['阿里云','LLM','Ollama','Fine-tuning'],examples:['一家金融公司用 Qwen2.5-72B 私有化部署，通过阿里云 PAI 进行微调。']},
{id:'wenxin',name:'文心一言',aliases:['文心','ERNIE Bot'],category:'大模型厂商',tags:['厂商','国内','大模型'],difficulty:'新手',en:'',one:'文心一言是百度推出的大模型产品，国内最早发布的 AI 对话产品之一。',plain:'文心一言是百度的大模型，国内最早发布。百度搜索、百度文库等都已经接入了文心大模型。',tech:'文心一言基于百度 ERNIE 系列模型，通过百度智能云提供 API 服务，与百度搜索、百度文库等产品深度集成。',why:'百度是国内最早投入大模型的公司之一，文心在搜索增强和知识图谱方面有积累。',biz:'与百度生态关联紧密的客户，文心一言是自然的 AI 方案选择。',useCases:['百度生态 AI 应用','搜索增强','知识问答'],related:['百度','LLM','API'],examples:['百度文库用文心大模型实现一键生成 PPT 和文档摘要。']},
{id:'kimi',name:'Kimi',aliases:['月之暗面','Moonshot'],category:'大模型厂商',tags:['厂商','国内','大模型'],difficulty:'新手',en:'',one:'Kimi 是月之暗面推出的 AI 助手，以超长上下文著称。',plain:'Kimi 是国内最早支持超长上下文的 AI 产品，能把一整本书丢进去让它分析。在长文档处理场景很实用。',tech:'Kimi 由月之暗面（Moonshot AI）开发，支持 200 万 Token 超长上下文，擅长长文档分析和信息提取。',why:'Kimi 证明了长上下文是 AI 产品的差异化卖点，推动了行业对上下文长度的重视。',biz:'客户需要处理长文档、长报告时，Kimi 是值得推荐的选择。',useCases:['长文档分析','论文阅读辅助','报告自动摘要'],related:['LLM','Context Window','大模型'],examples:['一位律师用 Kimi 一次分析 300 页诉讼材料，提取关键证据链。']},
{id:'agent',name:'Agent',aliases:['AI Agent','智能体'],category:'Agent体系',tags:['Agent','核心概念'],difficulty:'新手',en:'',one:'Agent 是能自主完成任务的 AI，不只是回答问题，而是"动手干活"。',plain:'ChatGPT 是"你问它答"，Agent 是"你说目标，它自己想办法完成"。就像从客服变成了私人助理——它会查资料、写方案、发邮件、调系统，一整套自己搞。',tech:'Agent 是基于 LLM 的自主系统，具备感知环境、制定计划、调用工具、执行行动和反思调整的能力，通过 Agent Loop 持续运行直到任务完成。',why:'Agent 是大模型从"对话工具"升级为"执行系统"的关键形态，是 AI 商业化的核心方向。',biz:'客户说"想让 AI 自动做事"——这就是 Agent。从客服到销售到运维，Agent 是 AI 落地的核心产品形态。',useCases:['自动处理客户工单','自动生成并提交报告','自动监控数据异常并告警'],related:['Agent Harness','Agent Loop','Tool Use','MCP','Multi-Agent'],examples:['一个销售 Agent 自动查阅客户资料、分析需求、生成拜访提纲，并预约会议。']},
{id:'multi-agent',name:'Multi-Agent',aliases:['多智能体','多Agent协作'],category:'Agent体系',tags:['Agent','架构'],difficulty:'进阶',en:'Multi-Agent System',one:'Multi-Agent 是多个 AI Agent 分工协作，一起完成复杂任务。',plain:'一个人干不了的活，一组人来干。Multi-Agent 就是让多个 AI"员工"各司其职，一个负责调研，一个负责写方案，一个负责审核，像一个虚拟团队。',tech:'Multi-Agent 系统由多个 Agent 实例组成，通过消息传递、共享状态或编排流程协作，支持并行执行、角色分工和结果聚合。',why:'复杂业务场景需要多个角色协作，Multi-Agent 架构让 AI 系统更接近真实团队运作。',biz:'客户说"想让 AI 同时处理多个环节"，Multi-Agent 就是对的架构选择。',useCases:['多角色内容生产流水线','多步骤审批自动化','跨系统数据协调'],related:['Agent','Agent Harness','CrewAI','AutoGen','LangGraph'],examples:['一个研究 Agent 调研市场，一个写作 Agent 写报告，一个审核 Agent 检查质量——三合一输出。']},
{id:'agent-harness',name:'Agent Harness',aliases:['Harness','Agent运行框架'],category:'Agent体系',tags:['Agent','开发框架'],difficulty:'进阶',en:'Agent Harness',one:'Agent Harness 是管理和调度 AI Agent 执行任务的运行框架。',plain:'如果把 Agent 看成一个员工，Harness 就像它的工作台和项目经理。Agent 负责干活，Harness 负责安排任务、记录状态、调用工具、管理上下文。',tech:'Agent Harness 通常负责管理 Agent 的任务执行、工具调用、上下文传递、状态记录和结果输出，是 Agent 运行的"操作系统"层。',why:'它让 Agent 不只是聊天，而是可以稳定地执行复杂任务。',biz:'当客户想让 AI 自动完成查资料、写方案、调系统、生成报告等复杂流程时，背后就可能需要 Agent Harness。',useCases:['自动生成销售方案','自动分析企业资料','自动调用多个工具完成任务'],related:['Agent','Workflow','Tool Calling','MCP'],examples:['一个销售 Agent 自动查询客户资料、分析需求、生成拜访提纲。']},
{id:'agent-loop',name:'Agent Loop',aliases:['Agent循环','智能体循环'],category:'Agent体系',tags:['Agent','核心概念'],difficulty:'进阶',en:'Agent Loop',one:'Agent Loop 是 Agent 持续思考→行动→观察→调整的循环过程。',plain:'Agent 不是"问一次答一次"，而是像人一样反复琢磨：我先想想怎么做→做一步→看看结果→再调整→继续做→直到完成。这个循环就是 Agent Loop。',tech:'Agent Loop 是 Agent 的核心执行模式，包含 Thought（思考）→ Action（行动）→ Observation（观察）三个阶段，循环往复直到任务完成或达到终止条件。',why:'Agent Loop 是 Agent 区别于普通聊天机器人的核心机制，使 Agent 具备了持续推理和自我调整的能力。',biz:'客户理解"AI 为什么能自动完成任务"时，Agent Loop 是最直观的解释模型。',useCases:['自动排查系统故障','多步骤数据分析','自动优化营销策略'],related:['Agent','ReAct','Reflection','Tool Use'],examples:['一个运维 Agent 发现服务异常→查日志→定位问题→重启服务→确认恢复。']},
{id:'agent-memory',name:'Agent Memory',aliases:['Agent记忆','智能体记忆'],category:'Agent体系',tags:['Agent','核心概念'],difficulty:'进阶',en:'Agent Memory',one:'Agent Memory 是让 AI Agent 记住之前做过什么、学到了什么的能力。',plain:'没有记忆的 Agent 就像失忆症患者，每次都从头来。Agent Memory 让它能记住用户偏好、历史对话、任务进度，越用越聪明。',tech:'Agent Memory 分为短期记忆（上下文窗口内）和长期记忆（外部存储），通过向量数据库、知识图谱或结构化存储实现持久化。',why:'记忆是 Agent 做复杂任务和长期服务的基础，没有记忆就只能做单次对话。',biz:'客户想要"AI 越用越懂我"的体验，就需要给 Agent 加上记忆能力。',useCases:['长期客户服务中的上下文保持','个性化推荐','任务进度的跨会话追踪'],related:['Agent','RAG','Vector Database'],examples:['一个销售 Agent 记住了每个客户的沟通历史和偏好，每次跟进都更精准。']},
{id:'tool-use',name:'Tool Use',aliases:['工具使用','工具调用'],category:'Agent体系',tags:['Agent','核心概念'],difficulty:'进阶',en:'Tool Use',one:'Tool Use 是 AI Agent 调用外部工具（API、数据库等）完成任务的能力。',plain:'Agent 光会"说"不够，还得会"做"。Tool Use 就是让 AI 能调用搜索引擎、发邮件、查数据库、调用系统 API 等，真正干活而不是纸上谈兵。',tech:'Tool Use 指 LLM 根据用户意图选择并调用预定义工具（函数/API），通过 Function Calling 或 MCP 等协议实现，将模型输出映射为实际操作。',why:'Tool Use 是 Agent 从"对话"升级为"执行"的关键能力，没有工具调用，Agent 就是个聊天机器人。',biz:'客户说"想让 AI 对接我们的系统"，背后就是 Tool Use——让 AI 调用企业系统的 API。',useCases:['查询企业数据库','发送通知邮件','调用第三方 API 获取实时数据'],related:['Agent','Function Calling','MCP','API'],examples:['一个财务 Agent 自动调用 ERP 系统 API 拉取报表数据，生成分析报告。']},
{id:'reflection',name:'Reflection',aliases:['反思','自我反思'],category:'Agent体系',tags:['Agent','核心概念'],difficulty:'进阶',en:'Reflection',one:'Reflection 是 Agent 检查自己输出质量、发现错误并修正的能力。',plain:'人做完事会回头检查，Agent 也一样。Reflection 让 AI "三思而后行"——先审视自己的答案，发现问题就改，减少错误。',tech:'Reflection 是 Agent 在执行过程中对自身输出进行评估和修正的机制，通过自我评价和迭代优化提高任务完成质量。',why:'Reflection 是提高 Agent 可靠性的重要手段，特别适合对准确性要求高的场景。',biz:'客户担心"AI 犯错怎么办"，Reflection 是一种自我纠错机制，可以增加客户信心。',useCases:['代码生成后自动审查','方案输出的质量检查','数据分析结果的自检'],related:['Agent','Self-Correction','Agent Loop'],examples:['一个写作 Agent 生成报告后自动检查逻辑漏洞和数据准确性，发现问题就修正后重新输出。']},
{id:'openai-agents-sdk',name:'OpenAI Agents SDK',aliases:['OpenAI Agent SDK'],category:'Agent体系',tags:['Agent','开发框架'],difficulty:'专业',en:'',one:'OpenAI Agents SDK 是 OpenAI 官方推出的 Agent 开发框架。',plain:'OpenAI 官方做的 Agent 开发工具包，帮你更方便地用 OpenAI 的模型构建 Agent 应用。就像用官方脚手架盖房子，比从零搭建省事。',tech:'OpenAI Agents SDK 提供了构建 AI Agent 的标准接口和工具链，支持工具调用、多 Agent 编排、安全防护等功能，与 OpenAI API 深度集成。',why:'官方 SDK 意味着最佳实践和稳定支持，是使用 OpenAI 模型构建 Agent 的首选方案。',biz:'客户选择 OpenAI 生态做 Agent 开发时，Agents SDK 是标准开发工具。',useCases:['构建 OpenAI 生态的 Agent 应用','多 Agent 协作编排','企业级 AI 助手开发'],related:['Agent','OpenAI','MCP','Function Calling'],examples:['一家公司用 Agents SDK 构建了自动客服 Agent，支持多轮对话和系统操作。']},
{id:'langgraph',name:'LangGraph',aliases:[],category:'Agent体系',tags:['Agent','开发框架'],difficulty:'进阶',en:'',one:'LangGraph 是 LangChain 推出的 Agent 编排框架，用图结构定义 Agent 流程。',plain:'LangGraph 让你像画流程图一样设计 Agent 的工作流。每个节点是一个步骤，边是步骤之间的跳转条件，支持循环、分支和并行。',tech:'LangGraph 基于 LangChain 构建，使用有向图（DAG）定义 Agent 工作流，支持状态管理、条件路由、循环和人工审批节点，适用于复杂的 Agent 编排场景。',why:'复杂 Agent 流程需要清晰的编排和控制，LangGraph 提供了结构化的解决方案。',biz:'客户需要构建复杂的 AI 工作流（比如多步骤审批、条件分支）时，LangGraph 是主流选择。',useCases:['多步骤审批流程自动化','带人工审核的 Agent 工作流','条件分支的业务流程'],related:['Agent','Workflow','Multi-Agent','CrewAI'],examples:['一个银行用 LangGraph 构建了贷款审批 Agent，自动审核+人工复核+条件路由。']},
{id:'crewai',name:'CrewAI',aliases:[],category:'Agent体系',tags:['Agent','开发框架'],difficulty:'进阶',en:'',one:'CrewAI 是一个多 Agent 协作框架，让多个 AI 角色像团队一样工作。',plain:'CrewAI 让你定义一个"AI 团队"：研究员、写作员、审核员各司其职，按照流程协作完成任务。就像组建一个虚拟团队。',tech:'CrewAI 提供 Role-based Agent 定义、Task 分配和 Process 编排，支持 Sequential 和 Hierarchical 两种协作模式，与 LangChain 工具生态兼容。',why:'CrewAI 降低了 Multi-Agent 系统的开发门槛，是快速搭建 AI 团队的实用框架。',biz:'客户需要"一组 AI 协作完成复杂任务"时，CrewAI 是最直观的方案。',useCases:['内容生产流水线','市场调研自动化','多角色协作的业务流程'],related:['Multi-Agent','Agent','LangGraph','AutoGen'],examples:['一个市场团队用 CrewAI 让研究员 AI 调研竞品、写手 AI 写分析报告、审核 AI 检查质量。']},
{id:'rag',name:'RAG',aliases:['检索增强生成','Retrieval Augmented Generation'],category:'RAG与知识库',tags:['知识库','核心技术'],difficulty:'新手',en:'Retrieval-Augmented Generation',one:'RAG 是让 AI 先查资料再回答的技术，大幅减少"胡说八道"。',plain:'AI 回答问题之前，先从你的知识库里检索相关内容，然后基于检索到的真实内容来回答。就像开卷考试，比凭记忆答题靠谱得多。',tech:'RAG 将信息检索与文本生成结合，先通过检索器从外部知识库获取相关文档片段，再将检索结果作为上下文输入 LLM 生成回答，缓解幻觉问题。',why:'RAG 是企业级 AI 应用最成熟的技术方案，解决了大模型知识过时和幻觉两大痛点。',biz:'客户说"想让 AI 回答基于我们自己的数据"——RAG 是标配方案。',useCases:['企业知识库问答','智能客服基于产品文档回答','法律/合规文档查询'],related:['Embedding','Vector Database','Chunking','Semantic Search','Hallucination'],examples:['一家保险公司用 RAG 让 AI 基于保险条款回答客户问题，准确率从 60% 提升到 95%。']},
{id:'embedding',name:'Embedding',aliases:['向量化','词嵌入','向量表示'],category:'RAG与知识库',tags:['知识库','核心技术'],difficulty:'进阶',en:'Embedding',one:'Embedding 是把文字变成数字向量的技术，让 AI 能计算"意思有多接近"。',plain:'AI 看不懂文字，但看得懂数字。Embedding 就是把一段文字翻译成一串数字，意思相近的文字数字也相近。这样 AI 就能通过"算数"来判断两段话是否相关。',tech:'Embedding 是将文本映射到高维向量空间的技术，语义相似的文本在向量空间中距离更近。常用模型包括 OpenAI text-embedding-3、BGE 等。',why:'Embedding 是 RAG、语义搜索和推荐系统的底层技术，是知识库的基础设施。',biz:'客户要做"智能搜索"或"知识库问答"，第一步就是把文档 Embedding 化存入向量库。',useCases:['语义搜索','文档相似度计算','RAG 的索引构建'],related:['RAG','Vector Database','Semantic Search'],examples:['用户搜索"退货政策"，系统能找到"退款流程"的文档——因为 Embedding 知道它们语义相近。']},
{id:'vector-database',name:'Vector Database',aliases:['向量数据库','向量库'],category:'RAG与知识库',tags:['知识库','基础设施'],difficulty:'进阶',en:'Vector Database',one:'Vector Database 是专门存储和检索向量数据的数据库，是 RAG 的核心组件。',plain:'普通数据库存文字和数字，向量数据库存"意思"。它能快速找到和你的问题"意思最接近"的内容，是 RAG 知识库的存储引擎。',tech:'Vector Database 专门用于存储和检索高维向量数据，支持近似最近邻搜索（ANN），常用产品包括 Milvus、Pinecone、Qdrant、Chroma 等。',why:'向量数据库是 RAG 架构的核心基础设施，直接影响检索质量和性能。',biz:'客户要做知识库方案时，向量数据库选型是关键决策——选 Milvus（开源）、Pinecone（SaaS）还是其他。',useCases:['企业知识库存储和检索','推荐系统的用户画像匹配','图像相似度搜索'],related:['RAG','Embedding','Milvus','Pinecone','FAISS'],examples:['一家企业用 Milvus 存储 10 万份产品文档的向量，实现毫秒级语义搜索。']},
{id:'chunking',name:'Chunking',aliases:['分块','文本分块'],category:'RAG与知识库',tags:['知识库','数据处理'],difficulty:'进阶',en:'Chunking',one:'Chunking 是把长文档切成小段的技术，让 AI 能逐段检索和理解。',plain:'AI 不能一口吞下一整本书，Chunking 就是把书拆成一段一段的。每段独立存入向量库，检索时只取相关的几段，既精准又高效。',tech:'Chunking 是将长文档分割为固定或语义感知的小段（Chunk）的过程，常见策略包括固定长度分块、句子级分块和语义分块，直接影响 RAG 的检索粒度。',why:'分块策略是 RAG 效果的关键变量，分得太大检索不精准，分得太小丢失上下文。',biz:'RAG 效果不好时，首先排查的就是 Chunking 策略——分块大小和重叠度是核心调优参数。',useCases:['长文档入库前的预处理','法律条文的分段检索','知识库的精细化索引'],related:['RAG','Embedding','Vector Database','Chunk'],examples:['一份 50 页的合同，按段落分成 200 个 Chunk，每个 Chunk 500 字，重叠 100 字。']},
{id:'semantic-search',name:'Semantic Search',aliases:['语义搜索','语义检索'],category:'RAG与知识库',tags:['知识库','搜索技术'],difficulty:'进阶',en:'Semantic Search',one:'Semantic Search 是按"意思"搜索而不是按"关键词"搜索的技术。',plain:'传统搜索是精确匹配关键词，语义搜索是理解你"想找什么"。搜"便宜的手机"能找到"高性价比智能手机"，因为意思相近。',tech:'Semantic Search 基于 Embedding 向量相似度进行检索，通过计算查询向量与文档向量的余弦相似度等指标，返回语义最相关的结果，而非关键词匹配。',why:'语义搜索让搜索更智能，尤其在用户不知道精确关键词时，体验远超传统搜索。',biz:'客户想要"比搜索框更聪明的搜索"，语义搜索就是核心能力。',useCases:['智能文档检索','知识库问答','商品推荐搜索'],related:['RAG','Embedding','Vector Database','Hybrid Search'],examples:['用户搜"如何办理退款"，系统能找到"退货与退款流程"的文档，即使关键词不完全匹配。']},
{id:'re-ranking',name:'Re-ranking',aliases:['重排','结果重排'],category:'RAG与知识库',tags:['知识库','搜索优化'],difficulty:'专业',en:'Re-ranking',one:'Re-ranking 是对初步检索结果进行二次排序，提高最终结果的相关性。',plain:'先粗筛再精选。向量检索快速找出可能相关的 100 条，Re-ranking 模型再用更深度的理解力选出最相关的 5 条，质量大幅提升。',tech:'Re-ranking 使用交叉编码器（Cross-Encoder）等模型对检索结果进行精细化的相关性打分和重排序，弥补向量检索在精度上的不足。',why:'Re-ranking 是 RAG 效果优化的关键环节，能显著提升检索精度。',biz:'RAG 方案效果不理想时，加一层 Re-ranking 通常是最有效的优化手段。',useCases:['RAG 检索结果优化','搜索结果精排','推荐系统二次排序'],related:['RAG','Semantic Search','Retrieval'],examples:['向量检索返回 50 条结果，Re-ranking 模型精排后取 Top 5，准确率从 70% 提升到 90%。']},
{id:'faiss',name:'FAISS',aliases:[],category:'RAG与知识库',tags:['知识库','开源工具'],difficulty:'专业',en:'Facebook AI Similarity Search',one:'FAISS 是 Meta 开源的高效向量检索库，适合本地快速部署。',plain:'FAISS 是一个免费的向量搜索工具，适合数据量不太大、想本地部署的场景。用 Python 就能跑，开发门槛低。',tech:'FAISS 是 Meta 开源的向量相似度搜索库，支持多种索引类型（IVF、HNSW 等）和 GPU 加速，适合百万到亿级向量检索。',why:'FAISS 是最流行的开源向量检索方案，轻量灵活，适合快速原型和小规模部署。',biz:'客户做 POC 或小规模 RAG 方案时，FAISS 是最简单的起步方案。',useCases:['本地 RAG 原型','中小规模向量检索','研发阶段的快速验证'],related:['Vector Database','Milvus','RAG','Embedding'],examples:['一个开发团队用 FAISS + Python 搭建了内部文档搜索，一周上线。']},
{id:'milvus',name:'Milvus',aliases:[],category:'RAG与知识库',tags:['知识库','开源工具'],difficulty:'专业',en:'',one:'Milvus 是开源的云原生向量数据库，适合大规模企业级 RAG 部署。',plain:'Milvus 是企业级的向量数据库，能处理亿级向量数据，支持分布式部署。如果 FAISS 是"小作坊"，Milvus 就是"大工厂"。',tech:'Milvus 是开源的分布式向量数据库，支持亿级向量检索、多种索引类型、云原生架构和水平扩展，是生产环境 RAG 的主流选择。',why:'Milvus 是国内最流行的开源向量数据库，在金融、电信等行业有大量生产案例。',biz:'客户需要大规模、高可用的向量检索方案时，Milvus 是首选开源方案。',useCases:['亿级文档向量检索','分布式知识库','高并发搜索服务'],related:['Vector Database','FAISS','RAG','Embedding'],examples:['一家银行用 Milvus 存储千万级合同向量，支持千人并发查询。']},
{id:'prompt',name:'Prompt',aliases:['提示词','提示'],category:'Prompt工程',tags:['Prompt','基础概念'],difficulty:'新手',en:'Prompt',one:'Prompt 是你给 AI 的指令，决定 AI 怎么理解和回答你的问题。',plain:'Prompt 就是你跟 AI 说话的方式。同一个问题，不同的问法会得到完全不同的答案。写好 Prompt 是让 AI 乖乖听话的第一步。',tech:'Prompt 是输入给 LLM 的文本指令，包括系统提示、用户输入和上下文信息。Prompt 质量直接影响模型输出的相关性和质量。',why:'Prompt 是使用 AI 的核心技能，好的 Prompt 能让同样的模型输出质量提升数倍。',biz:'客户用 AI 效果不好，往往不是模型的问题，而是 Prompt 没写好。优化 Prompt 是成本最低的提效手段。',useCases:['定义 AI 的角色和行为','引导 AI 按指定格式输出','约束 AI 的回答范围'],related:['System Prompt','Few-shot','Chain of Thought','Prompt Chaining'],examples:['把"写个方案"改成"你是一位资深咨询顾问，请写一份面向金融行业的 AI 解决方案，包含背景、方案、价值三部分"——效果天差地别。']},
{id:'system-prompt',name:'System Prompt',aliases:['系统提示词','系统指令'],category:'Prompt工程',tags:['Prompt','基础概念'],difficulty:'新手',en:'System Prompt',one:'System Prompt 是给 AI 设定"人设和规则"的指令，在对话开始前就告诉 AI 怎么做。',plain:'System Prompt 就像给新员工发的岗位说明书——你是什么角色、能做什么、不能做什么、说话风格是什么。用户看到的是对话，System Prompt 在背后约束 AI。',tech:'System Prompt 是 LLM 对话中的系统级指令，优先级最高，用于设定模型角色、行为约束、输出格式和安全边界，对后续所有对话生效。',why:'System Prompt 是控制 AI 行为的核心手段，直接决定 AI 的输出风格和边界。',biz:'客户说"AI 的回答太随意了"，通常需要优化 System Prompt 来约束行为。',useCases:['设定 AI 的角色和语气','约束 AI 只回答特定领域','定义输出格式和长度'],related:['Prompt','User Prompt','Context Engineering'],examples:['System Prompt："你是一位专业的法律顾问，只回答中国法律相关问题，不确定时明确告知。"']},
{id:'few-shot',name:'Few-shot',aliases:['少样本学习','示例学习'],category:'Prompt工程',tags:['Prompt','技术方法'],difficulty:'进阶',en:'Few-shot Learning',one:'Few-shot 是在 Prompt 里给 AI 几个例子，让它照着做的技巧。',plain:'与其跟 AI 解释半天"我想要什么样的回答"，不如直接给它看几个例子。就像教小朋友写字，先给他看几个范本。',tech:'Few-shot 是在 Prompt 中包含少量示例（通常 2-5 个），通过 In-context Learning 引导模型按照示例的模式生成输出，无需更新模型参数。',why:'Few-shot 是最实用的 Prompt 优化技巧之一，少量示例就能显著提升输出质量。',biz:'客户要 AI 按特定格式输出（如合同模板、报告格式），Few-shot 是最简单有效的方法。',useCases:['按模板生成文档','按特定风格写作','按格式输出结构化数据'],related:['Prompt','Zero-shot','Chain of Thought'],examples:['给 AI 看 3 个"客户回访摘要"示例，它就能按同样格式生成新的摘要。']},
{id:'chain-of-thought',name:'Chain of Thought',aliases:['思维链','CoT'],category:'Prompt工程',tags:['Prompt','技术方法'],difficulty:'进阶',en:'Chain of Thought',one:'Chain of Thought 是让 AI 一步步推理而不是直接给答案的技术。',plain:'让 AI "把思考过程写出来"，就像让学生"写解题步骤"而不是只写答案。一步步推理，答案更准。',tech:'Chain of Thought 是一种 Prompt 策略，通过要求模型展示中间推理步骤，显著提升在数学、逻辑等复杂推理任务上的准确性。',why:'CoT 是提升 LLM 推理能力最有效的方法之一，是 Reasoning Model 的基础技术。',biz:'客户要 AI 做复杂分析时，用 CoT 让 AI 展示推理过程，答案更可靠也更容易审计。',useCases:['复杂问题分解','数学和逻辑推理','多步骤决策分析'],related:['Prompt','Reasoning Model','ReAct','Few-shot'],examples:['问 AI "这个客户该给几折？"，不用 CoT 直接给答案；用 CoT 先分析客户等级→消费历史→利润率→推荐折扣。']},
{id:'react',name:'ReAct',aliases:['推理+行动'],category:'Prompt工程',tags:['Prompt','Agent'],difficulty:'进阶',en:'Reasoning + Acting',one:'ReAct 是让 AI 交替推理和行动的方法，想一步做一步。',plain:'ReAct 就是"边想边干"：先想该做什么→做一个动作→看结果→再想下一步。比纯思考更实际，比盲动更靠谱。',tech:'ReAct 是一种结合推理（Reasoning）和行动（Acting）的 Prompt 框架，让 LLM 交替生成思考（Thought）和行动（Action），通过观察（Observation）连接。',why:'ReAct 是 Agent 的核心推理范式，让 Agent 具备了"思考-行动-观察"的循环能力。',biz:'ReAct 是 Agent 自动化任务的理论基础，客户说"让 AI 边想边做"就是这个。',useCases:['Agent 自动化任务执行','多步骤信息检索','复杂问题分解与执行'],related:['Agent','Agent Loop','Chain of Thought','Tool Use'],examples:['一个研究 Agent：想"我需要查 X 数据"→搜索 X→看到结果→想"还需要 Y"→搜索 Y→综合回答。']},
{id:'structured-output',name:'Structured Output',aliases:['结构化输出','JSON输出'],category:'Prompt工程',tags:['Prompt','技术方法'],difficulty:'进阶',en:'Structured Output',one:'Structured Output 是让 AI 按指定格式（如 JSON）输出结果，方便程序直接使用。',plain:'AI 默认输出一大段文字，Structured Output 让它输出结构化的数据（比如 JSON），这样下游程序可以直接解析使用，不用人工处理。',tech:'Structured Output 通过 JSON Schema、Function Calling 或约束解码等技术，让 LLM 输出符合预定义结构的格式化数据，确保可被程序直接消费。',why:'Structured Output 是 AI 与软件系统集成的关键桥梁，没有它就只能人肉解析 AI 输出。',biz:'客户要把 AI 输出接入业务系统，Structured Output 是必须的——让 AI 输出系统能读的数据。',useCases:['AI 输出填充表单','AI 生成 API 请求参数','AI 输出存入数据库'],related:['JSON Schema','Function Calling','Prompt'],examples:['让 AI 分析客户需求后输出 JSON：{"intent": "退款", "urgency": "高", "product_id": "A123"}']},
{id:'context-engineering',name:'Context Engineering',aliases:['上下文工程'],category:'Prompt工程',tags:['Prompt','前沿概念'],difficulty:'专业',en:'Context Engineering',one:'Context Engineering 是精心设计 AI 输入上下文的技术，是 Prompt Engineering 的升级版。',plain:'Prompt Engineering 只关注"怎么写提示词"，Context Engineering 还关注"给 AI 喂什么信息"——包括检索到的文档、历史对话、工具结果等。是把 AI 当系统来设计，而不只是写提示词。',tech:'Context Engineering 是对 LLM 输入的全面管理，包括 System Prompt 设计、RAG 检索策略、对话历史管理、工具结果注入和上下文窗口优化。',why:'随着 AI 应用复杂度提升，单纯的 Prompt 优化不够了，需要系统性管理 AI 的整个上下文输入。',biz:'客户说"AI 效果不好"，问题往往不在 Prompt，而在上下文——该给的信息没给到位。',useCases:['复杂 Agent 的输入设计','RAG 系统的上下文优化','多工具调用的信息整合'],related:['Prompt','System Prompt','RAG','Agent'],examples:['一个销售 Agent 的上下文包括：角色设定 + 客户资料（RAG检索）+ 历史对话 + 产品信息 + 输出格式要求——这就是 Context Engineering。']},
{id:'mcp',name:'MCP',aliases:['Model Context Protocol','模型上下文协议'],category:'MCP与工具调用',tags:['MCP','协议','工具调用'],difficulty:'进阶',en:'Model Context Protocol',one:'MCP 是 Anthropic 提出的开放协议，让 AI 能统一对接各种工具和数据源。',plain:'以前每个 AI 工具都要单独写接口对接，MCP 像一个"万能转接头"——只要工具支持 MCP，AI 就能直接用，不用每次重新开发。',tech:'MCP 是 Anthropic 发布的开放标准协议，定义了 AI 模型与外部工具/数据源之间的通信规范，包括 MCP Server（工具端）和 MCP Client（模型端）。',why:'MCP 统一了 AI 工具调用的接口标准，让 AI 应用可以即插即用地对接各种系统。',biz:'客户问"AI 怎么对接我们的系统"，MCP 提供了标准化的对接方案，降低了集成成本。',useCases:['AI 对接企业内部系统','统一管理多个工具接口','AI 应用即插即用集成'],related:['MCP Server','MCP Client','Function Calling','Tool Calling','API'],examples:['一个 AI 助手通过 MCP 同时对接了 GitHub、Slack 和数据库，一条指令就能查代码、发消息、拉数据。']},
{id:'mcp-server',name:'MCP Server',aliases:['MCP服务端'],category:'MCP与工具调用',tags:['MCP','开发工具'],difficulty:'专业',en:'MCP Server',one:'MCP Server 是按照 MCP 协议封装的工具服务端，对外暴露能力给 AI 调用。',plain:'MCP Server 就是"工具端"——把你的数据库、API、文件系统等封装成 MCP 协议格式，AI 就能直接调用。像给 AI 装了一个"万能工具箱"。',tech:'MCP Server 按 MCP 协议实现工具注册、请求处理和响应返回，支持 Tools、Resources、Prompts 三种能力类型，通过 stdio 或 SSE 通信。',why:'MCP Server 是 AI 工具生态的基础，每个企业系统都可以封装成 MCP Server。',biz:'客户想让 AI 调用自己的系统，开发一个 MCP Server 是最标准化的方式。',useCases:['封装企业内部 API 为 MCP Server','数据库查询 MCP Server','文件系统访问 MCP Server'],related:['MCP','MCP Client','API','Tool Calling'],examples:['把公司 CRM 系统封装成 MCP Server，AI 就能直接查询客户信息、创建工单。']},
{id:'mcp-client',name:'MCP Client',aliases:['MCP客户端'],category:'MCP与工具调用',tags:['MCP','开发工具'],difficulty:'专业',en:'MCP Client',one:'MCP Client 是 AI 应用中对接 MCP Server 的客户端，负责发起工具调用请求。',plain:'MCP Client 是"AI 这边"的接口——AI 应用通过 Client 连接各种 MCP Server，像一个遥控器控制多个设备。',tech:'MCP Client 集成在 AI 应用中，负责发现、连接和调用 MCP Server 提供的工具和资源，管理连接生命周期和请求路由。',why:'MCP Client 是 AI 应用接入 MCP 生态的入口，决定了 AI 能调用哪些工具。',biz:'选择 AI 平台时，是否内置 MCP Client 决定了能否快速接入各种工具生态。',useCases:['AI IDE 对接 MCP 工具','AI Agent 调用外部服务','聊天应用扩展能力'],related:['MCP','MCP Server','Tool Calling'],examples:['Claude Desktop 内置 MCP Client，可以连接用户配置的各种 MCP Server。']},
{id:'function-calling',name:'Function Calling',aliases:['函数调用','函数调用能力'],category:'MCP与工具调用',tags:['工具调用','核心技术'],difficulty:'进阶',en:'Function Calling',one:'Function Calling 是让 AI 调用预定义函数的能力，是 AI 与系统对接的基础。',plain:'你告诉 AI "你可以调用这些函数"，AI 就会在需要时自动调用。比如你定义了"查天气"函数，AI 遇到天气相关问题时会自动调用并返回结果。',tech:'Function Calling 是 LLM 生成结构化函数调用参数的能力，模型根据对话上下文判断是否需要调用工具，输出 JSON 格式的函数名和参数，由应用层执行实际调用。',why:'Function Calling 是 AI 应用从"对话"走向"行动"的基础能力，是 Agent 和工具调用的底层机制。',biz:'客户要让 AI "真正干活"而不是"只会聊天"，就需要 Function Calling 来对接业务系统。',useCases:['AI 调用企业 API','AI 查询数据库','AI 执行系统操作'],related:['Tool Calling','MCP','API','Agent'],examples:['用户问"今天北京天气？"，AI 通过 Function Calling 调用天气 API，返回真实天气数据。']},
{id:'tool-calling',name:'Tool Calling',aliases:['工具调用'],category:'MCP与工具调用',tags:['工具调用','核心概念'],difficulty:'进阶',en:'Tool Calling',one:'Tool Calling 是 AI 调用外部工具（API、函数等）执行操作的统称。',plain:'Tool Calling 和 Function Calling 本质一样，只是叫法不同。Function Calling 是 OpenAI 的叫法，Tool Calling 是更通用的术语。',tech:'Tool Calling 是 LLM 调用外部工具的统称，包括 Function Calling、MCP 等多种实现方式，涵盖 API 调用、数据库查询、代码执行等操作。',why:'Tool Calling 是 Agent 执行任务的核心机制，不同框架和协议提供了不同的实现方式。',biz:'客户想让 AI 对接各种系统，Tool Calling 是技术实现层面需要理解的核心概念。',useCases:['AI 调用搜索工具','AI 执行代码','AI 操作外部系统'],related:['Function Calling','MCP','Agent','API'],examples:['一个 Agent 通过 Tool Calling 同时使用了搜索引擎、计算器和翻译工具来完成任务。']},
{id:'a2a',name:'A2A',aliases:['Agent to Agent','智能体互联协议'],category:'MCP与工具调用',tags:['Agent','协议'],difficulty:'专业',en:'Agent-to-Agent Protocol',one:'A2A 是让不同 Agent 之间互相通信和协作的协议。',plain:'MCP 解决的是"AI 对接工具"的问题，A2A 解决的是"AI 和 AI 之间怎么协作"的问题。让不同厂商的 Agent 能互相对话、分工合作。',tech:'A2A 协议定义了 Agent 之间的通信规范，包括能力发现、任务委派、结果回传等，支持异构 Agent 系统的互操作。',why:'A2A 是 Multi-Agent 系统走向开放生态的关键协议，让不同平台的 Agent 能协作。',biz:'客户有多套 AI 系统，需要它们互相配合时，A2A 提供了标准化的协作方案。',useCases:['跨平台 Agent 协作','企业内多系统 Agent 互通','第三方 Agent 能力调用'],related:['Agent','MCP','Multi-Agent'],examples:['Google 提出的 A2A 协议让不同厂商的 Agent 可以互相发现和调用能力。']},
{id:'computer-use',name:'Computer Use',aliases:['计算机操作','桌面操作'],category:'MCP与工具调用',tags:['工具调用','Agent'],difficulty:'进阶',en:'Computer Use',one:'Computer Use 是让 AI 像人一样操作电脑（点击、输入、拖拽）的能力。',plain:'以前 AI 只能通过 API 间接操作软件，Computer Use 让 AI 能直接看到屏幕、点击按钮、输入文字——就像有个人坐在电脑前帮你操作。',tech:'Computer Use 通过屏幕截图理解界面状态，生成鼠标点击、键盘输入等操作指令，实现对桌面应用和网页的自动化操作。',why:'Computer Use 让 AI 能操作没有 API 的传统软件，大幅扩展了 AI 的适用范围。',biz:'客户有大量传统软件（ERP、OA）没有 API，Computer Use 是让 AI 操作它们的可行方案。',useCases:['自动化操作传统 ERP 系统','批量处理桌面应用任务','RPA 场景的 AI 替代'],related:['Browser Use','Agent','Tool Calling'],examples:['Claude 的 Computer Use 可以看到屏幕、点击按钮、填写表单，自动化操作任何桌面软件。']},
{id:'browser-use',name:'Browser Use',aliases:['浏览器操作','网页自动化'],category:'MCP与工具调用',tags:['工具调用','Agent'],difficulty:'进阶',en:'Browser Use',one:'Browser Use 是让 AI 像人一样浏览网页、点击、填表的能力。',plain:'Browser Use 是 Computer Use 的"网页版"——AI 能打开浏览器、搜索信息、点击链接、填写表单，帮你在网上自动办事。',tech:'Browser Use 通过操控浏览器（Playwright/Puppeteer 等）实现网页导航、元素交互和数据提取，是 AI Agent 执行网络任务的核心能力。',why:'Browser Use 让 AI 能自动化完成大量网页操作任务，是 Agent 的重要能力之一。',biz:'客户需要 AI 自动采集网页数据、自动操作网页系统时，Browser Use 是核心技术。',useCases:['自动采集竞品价格','自动填写网页表单','自动登录系统获取数据'],related:['Computer Use','Agent','Tool Calling'],examples:['一个 Agent 通过 Browser Use 自动登录供应商网站，下载最新的产品报价单。']},
{id:'cursor',name:'Cursor',aliases:[],category:'AI开发工具',tags:['开发工具','IDE'],difficulty:'新手',en:'',one:'Cursor 是目前最火的 AI 编程编辑器，让写代码像聊天一样简单。',plain:'Cursor 是基于 VS Code 改造的 AI 编辑器，你可以在里面跟 AI 对话写代码、自动补全、解释代码、修复 Bug。程序员用了都说效率翻倍。',tech:'Cursor 是基于 VS Code 的 AI IDE，集成了 GPT-4/Claude 等模型，支持代码补全、对话式编辑、代码库理解、多文件修改等功能，通过 Tab 和 Cmd+K 交互。',why:'Cursor 代表了 AI 编程工具的主流形态，正在改变开发者的工作方式。',biz:'客户想要提升开发团队效率，Cursor 是目前最推荐的 AI 编程工具。',useCases:['AI 辅助编写代码','自动补全和重构','Bug 修复和代码解释'],related:['IDE','VS Code','Windsurf','Trae','Claude Code'],examples:['一个开发者用 Cursor 的 Composer 功能，一句话生成一个完整的 React 组件。']},
{id:'trae',name:'Trae',aliases:[],category:'AI开发工具',tags:['开发工具','IDE'],difficulty:'新手',en:'',one:'Trae 是字节跳动推出的 AI IDE，国内版叫 Trae，国际版叫 Trae CN。',plain:'Trae 是字节跳动对标 Cursor 做的 AI 编程工具，免费使用，内置豆包等国产模型。对国内开发者来说，不用翻墙就能用。',tech:'Trae 是字节跳动推出的 AI IDE，基于 VS Code 架构，内置豆包/DeepSeek 等模型，支持代码补全、对话编辑和 Builder 模式。',why:'Trae 为国内开发者提供了无需翻墙的 AI 编程工具选择，免费策略降低了使用门槛。',biz:'客户在国内环境下需要 AI 编程工具，Trae 是 Cursor 的国产替代。',useCases:['国内环境 AI 编程','使用国产模型写代码','免费 AI 辅助开发'],related:['Cursor','IDE','豆包','VS Code'],examples:['一个国内开发者用 Trae + DeepSeek 模型，免费完成了 Cursor 付费版的功能。']},
{id:'claude-code',name:'Claude Code',aliases:[],category:'AI开发工具',tags:['开发工具','CLI'],difficulty:'专业',en:'',one:'Claude Code 是 Anthropic 推出的命令行 AI 编程工具，在终端里直接写代码。',plain:'Claude Code 不像 Cursor 有图形界面，它在终端里运行。你用命令行跟它对话，它直接修改你的代码文件。适合高级开发者。',tech:'Claude Code 是 Anthropic 推出的 agentic 编程工具，运行在终端中，支持理解整个代码库、编辑文件、运行命令和 Git 操作。',why:'Claude Code 代表了 AI 编程的另一种范式——终端 Agent，适合偏好命令行的开发者。',biz:'高级开发团队需要更强大的 AI 编程 Agent 时，Claude Code 是专业选择。',useCases:['大型代码库理解和修改','自动化重构','终端环境 AI 编程'],related:['Cursor','OpenAI Codex','Agent'],examples:['一个架构师用 Claude Code 在终端中让 AI 重构整个微服务项目的依赖关系。']},
{id:'github-copilot',name:'GitHub Copilot',aliases:['Copilot'],category:'AI开发工具',tags:['开发工具','IDE'],difficulty:'新手',en:'',one:'GitHub Copilot 是微软/GitHub 推出的 AI 编程助手，最早的 AI 编程工具之一。',plain:'GitHub Copilot 是"AI 写代码"的鼻祖产品，集成在 VS Code 等 IDE 中。你写注释，它补全代码；你写开头，它续写后面。',tech:'GitHub Copilot 基于 OpenAI Codex 模型，支持代码补全、Chat 对话、CLI 工具和 Workspace 功能，深度集成 VS Code 和 GitHub 生态。',why:'Copilot 是 AI 编程工具的开创者，拥有最大的用户基础和企业客户。',biz:'已经在用 GitHub 的企业客户，Copilot 是最自然的 AI 编程工具选择。',useCases:['VS Code 中的代码补全','GitHub PR 自动审查','企业级 AI 编程助手'],related:['Cursor','IDE','VS Code','OpenAI'],examples:['微软内部数据显示，使用 Copilot 的开发者效率提升 55%。']},
{id:'windsurf',name:'Windsurf',aliases:['Codeium Windsurf'],category:'AI开发工具',tags:['开发工具','IDE'],difficulty:'新手',en:'',one:'Windsurf 是 Codeium 推出的 AI IDE，主打 Cascade 多步骤编程能力。',plain:'Windsurf 是 Cursor 的竞争者，特色是 Cascade 功能——AI 可以连续多步骤修改代码，不只是单次补全。',tech:'Windsurf 由 Codeium 推出，核心特性 Cascade 支持 Agent 式的多步骤代码修改，自动理解项目上下文，跨文件编辑。',why:'Windsurf 提供了 Cursor 之外的另一种 AI IDE 选择，Cascade 模式代表了 IDE 向 Agent 化演进的趋势。',biz:'客户评估 AI IDE 时，Windsurf 是 Cursor 的重要对比选项。',useCases:['多步骤代码修改','跨文件重构','AI 辅助全栈开发'],related:['Cursor','IDE','VS Code'],examples:['一个全栈开发者用 Windsurf Cascade 一口气修改了前后端 10 个文件，完成一个功能。']},
{id:'bolt',name:'Bolt',aliases:['Bolt.new'],category:'AI开发工具',tags:['开发工具','AI生成'],difficulty:'新手',en:'',one:'Bolt 是一个 AI 全栈开发平台，用对话就能生成完整 Web 应用。',plain:'不需要会写代码，用 Bolt 对话就能做出一个网站或 App。它帮你写前端、后端和部署，从零到上线一条龙。',tech:'Bolt.new 是 StackBlitz 推出的 AI 全栈开发平台，支持通过对话生成完整的 Web 应用，内置 WebContainer 运行时，可直接预览和部署。',why:'Bolt 代表了"零代码 AI 开发"的方向，让非技术人员也能快速构建 Web 应用。',biz:'客户想要快速做产品原型或简单应用，Bolt 是最快的方案之一。',useCases:['快速构建产品原型','非技术人员开发简单应用','AI 生成完整 Web 项目'],related:['V0','Lovable','Replit','Cursor'],examples:['一个产品经理用 Bolt 在 30 分钟内生成了一个完整的待办事项 Web 应用。']},
{id:'v0',name:'V0',aliases:['v0.dev'],category:'AI开发工具',tags:['开发工具','AI生成'],difficulty:'新手',en:'',one:'V0 是 Vercel 推出的 AI UI 生成工具，用对话生成前端界面代码。',plain:'跟 V0 说"做一个登录页面"，它直接生成 React + Tailwind 代码，还能实时预览和修改。专门做 UI，不做后端。',tech:'V0 是 Vercel 的 AI UI 生成工具，通过对话生成 React + Tailwind CSS + shadcn/ui 组件代码，支持实时预览和迭代修改。',why:'V0 大幅降低了前端 UI 开发门槛，是快速原型和 UI 设计的新范式。',biz:'客户需要快速出 UI 原型，V0 是最高效的前端生成工具。',useCases:['快速生成 UI 原型','前端组件代码生成','非设计人员创建界面'],related:['Bolt','Lovable','Cursor','Replit'],examples:['一个设计师用 V0 生成了一套完整的管理后台 UI，省去了一周的前端开发时间。']},
{id:'devin',name:'Devin',aliases:[],category:'AI开发工具',tags:['开发工具','AI程序员'],difficulty:'进阶',en:'',one:'Devin 是 Cognition 推出的"AI 软件工程师"，能独立完成完整的开发任务。',plain:'Devin 不只是辅助写代码，它是一个完整的"AI 程序员"——有自己的终端、浏览器、编辑器，能独立理解需求、写代码、测试、修复 Bug。',tech:'Devin 是 Cognition 推出的自主 AI 软件工程师，具备独立的计算环境（终端、浏览器、代码编辑器），能端到端完成软件开发任务。',why:'Devin 代表了 AI 从"辅助工具"到"独立开发者"的演进方向。',biz:'客户想要 AI 完全代替开发者做简单任务时，Devin 是最接近这个目标的产品。',useCases:['独立完成小型开发任务','Bug 修复和代码迁移','自动化测试编写'],related:['Cursor','Claude Code','Agent'],examples:['Devin 在 SWE-bench 测试中能独立解决 13.86% 的真实 GitHub Issue。']},
{id:'workflow',name:'Workflow',aliases:['工作流','AI工作流'],category:'AI工作流与应用平台',tags:['工作流','核心概念'],difficulty:'新手',en:'Workflow',one:'Workflow 是把多个 AI 步骤按流程串起来，自动完成复杂任务。',plain:'Workflow 就像流水线——第一步查数据，第二步分析，第三步写报告，第四步发邮件。每个步骤由 AI 自动执行，流程之间自动衔接。',tech:'Workflow 是对 AI 任务流的编排，将多个 LLM 调用、工具调用、条件判断和数据传递步骤按 DAG 或状态机方式组织，实现自动化执行。',why:'Workflow 是 AI 从"单次对话"到"自动化流程"的关键，是 Agent 落地的主要产品形态。',biz:'客户说"想让 AI 自动跑一套流程"，Workflow 就是实现方式。',useCases:['自动生成周报','客户投诉自动处理流程','数据采集→分析→报告全链路'],related:['Agent','Coze','Dify','Agentic Workflow'],examples:['一个 Workflow：每天早上自动采集行业新闻→AI 分析摘要→发送到企业微信群。']},
{id:'coze',name:'Coze',aliases:['扣子'],category:'AI工作流与应用平台',tags:['工作流','平台','字节跳动'],difficulty:'新手',en:'',one:'Coze 是字节跳动推出的 AI 应用搭建平台，零代码搭建 AI Bot 和工作流。',plain:'在 Coze 上，不用写代码就能搭建 AI 应用：拖拽式设计工作流、配置知识库、设置 Prompt，然后发布到微信、飞书等渠道。',tech:'Coze 是字节跳动的 AI Bot 开发平台，支持 Workflow 编排、知识库接入、Plugin 扩展和多渠道发布，底层调用豆包等大模型。',why:'Coze 降低了 AI 应用开发门槛，让非技术人员也能搭建 AI 助手和工作流。',biz:'客户想快速搭建 AI 应用又没有开发团队，Coze 是最优选择。',useCases:['零代码搭建智能客服','创建企业知识库问答 Bot','设计自动化工作流'],related:['Workflow','Dify','豆包','字节跳动'],examples:['一家中小企业用 Coze 一天搭建了智能客服 Bot，接入微信公众号，当天上线。']},
{id:'dify',name:'Dify',aliases:[],category:'AI工作流与应用平台',tags:['工作流','平台','开源'],difficulty:'进阶',en:'',one:'Dify 是开源的 AI 应用开发平台，适合有技术团队的私有化部署。',plain:'Dify 和 Coze 类似，但它是开源的，可以自己部署。适合对数据安全有要求、想要更多控制权的企业。',tech:'Dify 是开源的 LLM 应用开发平台，支持 Workflow 编排、RAG 管道、Agent 模式和多模型切换，可私有化部署。',why:'Dify 是开源 AI 应用平台的最热门选择，为企业提供了数据自主可控的方案。',biz:'客户要求数据不出公司、私有化部署 AI 应用，Dify 是首选开源方案。',useCases:['私有化部署 AI 应用','企业级 RAG 知识库','多模型统一管理'],related:['Coze','Workflow','RAG','LangFlow'],examples:['一家金融机构用 Dify 私有化部署了内部 AI 助手，数据全部在本地。']},
{id:'n8n',name:'n8n',aliases:[],category:'AI工作流与应用平台',tags:['工作流','自动化','开源'],difficulty:'进阶',en:'',one:'n8n 是开源的工作流自动化工具，支持 AI 节点和 400+ 应用集成。',plain:'n8n 是一个"连线工具"——把各种软件和 AI 用线连起来，让数据自动流转。比如收到邮件→AI 分析→写入表格→发通知。',tech:'n8n 是开源的工作流自动化平台，支持可视化节点编排、AI Agent 节点、400+ 第三方应用集成和自托管部署。',why:'n8n 桥接了 AI 和传统软件，让 AI 能轻松融入现有的业务工具链。',biz:'客户想要"AI + 现有系统"的自动化方案，n8n 是连接层的好选择。',useCases:['跨系统数据同步','AI 增强的业务流程自动化','多应用集成编排'],related:['Workflow','Dify','Make','Zapier'],examples:['用 n8n 搭建：收到客户邮件→AI 分类→自动创建工单→通知销售。']},
{id:'agentic-workflow',name:'Agentic Workflow',aliases:['智能体工作流','Agent化工作流'],category:'AI工作流与应用平台',tags:['工作流','Agent'],difficulty:'进阶',en:'Agentic Workflow',one:'Agentic Workflow 是让 AI Agent 自主决策和执行的工作流，比传统工作流更灵活。',plain:'传统 Workflow 每一步都是写死的，Agentic Workflow 让 AI 自己决定走哪步、用什么工具。像从"流水线工人"升级为"项目经理"。',tech:'Agentic Workflow 在传统 Workflow 基础上引入 Agent 自主决策能力，支持动态路由、工具选择和条件分支，兼具 Workflow 的可控性和 Agent 的灵活性。',why:'Agentic Workflow 是 Workflow 和 Agent 的融合方向，兼顾灵活性和可控性。',biz:'客户的流程太复杂、分支太多，传统 Workflow 写不完，Agentic Workflow 让 AI 自主处理。',useCases:['复杂的客户服务流程','动态选择工具的自动化任务','需要人工审核的混合流程'],related:['Workflow','Agent','Agent Harness','LangGraph'],examples:['一个 Agentic Workflow：AI 分析客户投诉→自主决定走退款/换货/升级流程→必要时人工介入。']},
{id:'openai-api',name:'OpenAI API',aliases:[],category:'模型部署与API',tags:['API','云服务'],difficulty:'进阶',en:'',one:'OpenAI API 是调用 GPT 系列模型的官方接口，是 AI 应用开发的标准入口。',plain:'想让你的产品用上 ChatGPT 的能力，就通过 OpenAI API 来调用。按 Token 付费，用多少花多少。',tech:'OpenAI API 提供 Chat Completions、Embeddings、Images、Audio 等接口，支持 GPT-4o、o1 等模型，按 Token 用量计费。',why:'OpenAI API 是全球使用最广泛的 AI API，定义了行业接口标准。',biz:'客户想接入 GPT 模型，OpenAI API 是标准通道，需注意国内访问合规性。',useCases:['企业 AI 应用接入 GPT 模型','聊天机器人开发','内容生成自动化'],related:['API','OpenAI','LLM','Token'],examples:['一家 SaaS 公司通过 OpenAI API 为产品增加了 AI 写作功能。']},
{id:'azure-openai',name:'Azure OpenAI',aliases:[],category:'模型部署与API',tags:['API','云服务','企业级'],difficulty:'进阶',en:'',one:'Azure OpenAI 是微软云上的 OpenAI 服务，企业级合规和数据隐私保障。',plain:'和 OpenAI API 功能一样，但跑在微软 Azure 上。对大企业来说，数据不经过 OpenAI，合规性更好。',tech:'Azure OpenAI 是微软 Azure 云上的 OpenAI 模型托管服务，提供与 OpenAI API 兼容的接口，支持企业级 SLA、数据隐私和合规认证。',why:'Azure OpenAI 解决了企业使用 OpenAI 模型的合规顾虑，是大型企业的首选方案。',biz:'大客户、金融、政府等对合规要求高的场景，Azure OpenAI 是唯一合规的 GPT 接入方式。',useCases:['金融行业 AI 应用','政府合规场景','企业级 AI 服务'],related:['OpenAI API','API','Vertex AI','Amazon Bedrock'],examples:['一家银行通过 Azure OpenAI 部署了合规的智能客服，数据不出 Azure 区域。']},

// ===== HELPERS =====
const getTermsByCat=c=>terms.filter(t=>t.category===c);
const getHot=()=>['llm','agent','mcp','rag','prompt','embedding','workflow','function-calling','cursor','coze'].map(id=>terms.find(t=>t.id===id)).filter(Boolean);
const getRecent=()=>[...terms].sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).slice(0,6);
const getAllTags=()=>{const s=new Set();terms.forEach(t=>t.tags.forEach(g=>s.add(g)));return[...s].sort()};
const search=q=>{const l=q.toLowerCase().trim();if(!l)return[];return terms.filter(t=>[t.name,t.en||'',...(t.aliases||[]),t.one,t.category,...t.tags,t.plain].join(' ').toLowerCase().includes(l)).sort((a,b)=>{if(a.name.toLowerCase()===l)return-1;if(b.name.toLowerCase()===l)return 1;return 0})};
const catSlug=c=>categories.find(x=>x.name===c)?.slug||'';

// ===== ROUTER =====
let currentView='home';
let currentId='';
let currentSlug='';
let searchQuery='';

function render(){
  const app=document.getElementById('app');
  if(currentView==='detail')app.innerHTML=renderDetail(currentId);
  else if(currentView==='category')app.innerHTML=renderCategory(currentSlug);
  else app.innerHTML=renderHome();
  window.scrollTo(0,0);
}

function navigate(view,id='',slug=''){
  currentView=view;currentId=id;currentSlug=slug;searchQuery='';render();
}

// ===== RENDER: HOME =====
function renderHome(){
  const hot=getHot();
  const recent=getRecent();
  const allTags=getAllTags();
  return `
  <div class="hero">
    <h1>AI黑话<span>翻译器</span></h1>
    <p>让AI术语不再难懂。面向学习者、产品经理、商务人员的AI知识库。</p>
    <div class="search-wrap">
      <svg class="icon" width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
      <input id="searchInput" type="text" placeholder="搜索AI术语、工具、厂商... 例如：LLM、Agent、RAG" value="${searchQuery}" onkeydown="if(event.key==='Enter')doSearch(this.value)">
      <button onclick="doSearch(document.getElementById('searchInput').value)">搜索</button>
    </div>
  </div>
  ${searchQuery?renderSearchResults(searchQuery):renderDefaultContent(hot,recent,allTags)}
  <div class="footer">AI黑话翻译器 · 让AI术语不再难懂 · 内置 ${terms.length}+ 词条</div>`;
}

function renderSearchResults(q){
  const results=search(q);
  return `<div class="section">
    <div class="filter-bar"><h2>搜索"${q}" <span style="font-weight:400;color:var(--gray-400);font-size:13px">${results.length} 个词条</span></h2><span class="clear" onclick="searchQuery='';render()">清除筛选</span></div>
    ${results.length?`<div class="cards-grid">${results.map(t=>renderCard(t)).join('')}</div>`:'<div class="empty"><p>没有找到相关词条</p><p style="font-size:13px">试试其他关键词或分类</p></div>'}
  </div>`;
}

function renderDefaultContent(hot,recent,allTags){
  return `
  <div class="section"><div class="section-title">🔥 热门术语</div><div class="hot-wrap">${hot.map(t=>`<span class="hot-item" onclick="navigate('detail','${t.id}')">🔥 ${t.name}</span>`).join('')}</div></div>
  <div class="section"><div class="section-title">📂 分类导航</div><div class="cat-grid">${categories.map(c=>{const n=getTermsByCat(c.name).length;return`<div class="cat-item" onclick="navigate('category','','${c.slug}')"><span class="emoji">${c.icon}</span><span class="name">${c.name}</span><span class="count">${n} 词条</span></div>`}).join('')}</div></div>
  <div class="section"><div class="section-title">🏷️ 标签筛选</div><div class="tag-wrap">${allTags.map(t=>`<span class="tag-item" onclick="doSearch('${t}')">${t}</span>`).join('')}</div></div>
  <div class="section"><div class="section-title">✨ 最新收录</div><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px">${recent.map(t=>`<div class="card" onclick="navigate('detail','${t.id}')" style="display:flex;align-items:center;gap:12px;padding:12px"><span style="shrink:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;background:var(--primary-bg);color:var(--primary-700);border-radius:8px;font-size:12px;font-weight:700">N</span><div style="min-width:0"><div style="font-size:13px;font-weight:500;color:var(--gray-900)">${t.name}</div><div style="font-size:11px;color:var(--gray-400);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${t.one}</div></div></div>`).join('')}</div></div>
  <div class="section"><div class="section-title">📋 全部词条 <span style="font-weight:400;color:var(--gray-400);font-size:13px">${terms.length} 个</span></div><div class="cards-grid">${terms.map(t=>renderCard(t)).join('')}</div></div>`;
}

function renderCard(t){
  return `<div class="card" onclick="navigate('detail','${t.id}')">
    <div class="card-header"><span class="card-name">${t.name}</span><span class="difficulty difficulty-${t.difficulty}">${t.difficulty}</span></div>
    ${t.en&&t.en!==t.name?`<div class="card-en">${t.en}</div>`:''}
    <div class="card-desc">${t.one}</div>
    <div class="card-tags">${t.tags.slice(0,3).map(g=>`<span class="card-tag">${g}</span>`).join('')}</div>
  </div>`;
}

// ===== RENDER: DETAIL =====
function renderDetail(id){
  const t=terms.find(x=>x.id===id);
  if(!t)return'<div class="detail"><p>未找到词条</p><span class="back-btn" onclick="navigate(\'home\')">← 返回首页</span></div>';
  const related=t.related.map(r=>terms.find(x=>x.id===r||x.name===r)).filter(Boolean);
  const slug=catSlug(t.category);
  return `<div class="detail fade-in">
    <nav class="breadcrumb"><a onclick="navigate('home')">首页</a><span>/</span><a onclick="navigate('category','','${slug}')">${t.category}</a><span>/</span><span style="color:var(--gray-600)">${t.name}</span></nav>
    <div class="detail-header">
      <div style="display:flex;align-items:flex-start;gap:12px;margin-bottom:8px"><h1>${t.name}</h1><span class="difficulty difficulty-${t.difficulty}">${t.difficulty}</span></div>
      ${t.en&&t.en!==t.name?`<div class="detail-en">${t.en}</div>`:''}
      ${t.aliases&&t.aliases.length?`<div class="detail-aliases">${t.aliases.map(a=>`<span class="detail-alias">${a}</span>`).join('')}</div>`:''}
      <div class="detail-sentence">${t.one}</div>
    </div>
    <div class="detail-section"><h2>💬 人话解释</h2><div class="detail-box purple">${t.plain}</div></div>
    <div class="detail-section"><h2>🔬 技术解释</h2><p class="detail-text">${t.tech}</p></div>
    <div class="detail-section"><h2>❓ 为什么会出现</h2><p class="detail-text">${t.why}</p></div>
    ${t.biz?`<div class="detail-section"><h2>💼 商务人员怎么理解</h2><div class="detail-box amber">${t.biz}</div></div>`:''}
    <div class="detail-section"><h2>🎯 典型应用场景</h2><div style="display:grid;gap:8px">${t.useCases.map((u,i)=>`<div class="use-case"><span class="num">${i+1}</span><span class="text">${u}</span></div>`).join('')}</div></div>
    <div class="detail-section"><h2>📌 应用案例</h2><div style="display:grid;gap:8px">${t.examples.map(e=>`<div class="example-box">${e}</div>`).join('')}</div></div>
    ${related.length?`<div class="detail-section"><h2>🔗 相关术语</h2><div class="related-wrap">${related.map(r=>`<span class="related-item" onclick="navigate('detail','${r.id}')">${r.name}</span>`).join('')}</div></div>`:''}
    <div class="detail-section"><h2>🏷️ 标签</h2><div class="tag-wrap">${t.tags.map(g=>`<span class="tag-item" onclick="doSearch('${g}')">${g}</span>`).join('')}</div></div>
    <span class="back-btn" onclick="navigate('home')">← 返回首页</span>
  </div>`;
}

// ===== RENDER: CATEGORY =====
function renderCategory(slug){
  const cat=categories.find(c=>c.slug===slug);
  if(!cat)return'<div class="detail"><p>未找到分类</p><span class="back-btn" onclick="navigate(\'home\')">← 返回首页</span></div>';
  const catTerms=getTermsByCat(cat.name);
  return `<div style="max-width:960px;margin:0 auto;padding:32px 16px" class="fade-in">
    <nav class="breadcrumb"><a onclick="navigate('home')">首页</a><span>/</span><span style="color:var(--gray-600)">${cat.name}</span></nav>
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px"><span style="font-size:2rem">${cat.icon}</span><h1 style="font-size:1.75rem;font-weight:700">${cat.name}</h1></div>
    <p style="color:var(--gray-500);margin-bottom:24px">${cat.desc} · ${catTerms.length} 个词条</p>
    ${catTerms.length?`<div class="cards-grid">${catTerms.map(t=>renderCard(t)).join('')}</div>`:'<div class="empty"><p>该分类暂无词条</p></div>'}
    <div style="margin-top:32px"><div class="section-title">其他分类</div><div style="display:flex;flex-wrap:wrap;gap:8px">${categories.filter(c=>c.slug!==slug).map(c=>`<span class="related-item" onclick="navigate('category','','${c.slug}')">${c.icon} ${c.name}</span>`).join('')}</div></div>
    <span class="back-btn" onclick="navigate('home')">← 返回首页</span>
  </div>`;
}

// ===== ACTIONS =====
function doSearch(q){searchQuery=q.trim();render();const input=document.getElementById('searchInput');if(input)input.value=searchQuery;}

// ===== INIT =====
render();
</script>
</body>
</html>
